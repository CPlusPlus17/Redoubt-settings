/** [SECTION] SYSTEM
 * The reporter extension of webcompat is disabled, urls are stripped for defense in depth.
 *
 * WHY DESKTOP: the extension these gate is browser/extensions/webcompat, wired
 * up by browser/components/BrowserGlue.sys.mjs:906 [browser/]. Android ships a
