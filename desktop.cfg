 * [CATEGORY] BUILT-IN FEATURES
 * ------------------------------- */

/** [SECTION] UPDATER
 * WHY DESKTOP: toolkit/mozapps/update is built only with MOZ_UPDATER
 * (toolkit/moz.build) and assets/mozconfig.android passes --disable-updater; the
 * app.update.url.* and app.releaseNotesURL.{aboutDialog,prompt} readers are
 * UpdateService/UpdateListener and browser/base/content/aboutDialog.js.
 * app.releaseNotesURL itself is also read by toolkit/content/about.js, so
 * android.cfg sets its own, version-independent value. app.update.auto is no
 * longer locked on desktop (upstream "Add the updater settings"); android.cfg
 * keeps it locked. (assets/mozconfig.new still says --disable-updater at the
 * time of the 157 merge; these prefs are upstream's and are taken as-is.)
 */
defaultPref("app.update.interval", 14400);
defaultPref("app.update.promptWaitTime", 0);

defaultPref("app.update.url.manual", "https://librewolf.net/installation/");
defaultPref("app.update.url.details", "https://librewolf.dev/librewolf/bsys6/releases");
defaultPref("app.releaseNotesURL", "https://librewolf.dev/librewolf/bsys6/releases/tag/%VERSION_DISPLAY%");
defaultPref("app.releaseNotesURL.aboutDialog", "https://librewolf.dev/librewolf/bsys6/releases/tag/%VERSION_DISPLAY%");
defaultPref("app.releaseNotesURL.prompt", "https://librewolf.dev/librewolf/bsys6/releases/tag/%VERSION_DISPLAY%");

defaultPref("app.update.checkInstallTime.days", 7);
defaultPref("app.update.badgeWaitTime", 0);

defaultPref("app.update.disabledForTesting", false);

/** [SECTION] SYNC
 * this functionality is disabled by default but it can be activated in one click.
 * this pref fully controls the feature, including its ui.
 *
 * WHY DESKTOP: [fxa]. services/fxaccounts is not built on Android and neither
 * is services/sync, so FxAccounts.sys.mjs and Weave.sys.mjs -- the two readers
 * outside browser/ -- do not exist there.
 * -> android.cfg gap: Fenix's account and sync stack is Kotlin over
 *    application-services and is untouched by this pref. It has to be removed
 *    or disabled in the Kotlin layer (M4).
 */
defaultPref("identity.fxaccounts.enabled", false);

/** [SECTION] CONTAINERS
 * WHY DESKTOP: this one only reveals the containers UI, and its readers are
