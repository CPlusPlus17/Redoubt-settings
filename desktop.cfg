/** ------------------------------
 * [CATEGORY] TELEMETRY
 * ------------------------------- */

/** WHY DESKTOP: [messaging]. toolkit/components/normandy is only added to DIRS
 * for MOZ_BUILD_APP == "browser", so RecipeRunner.sys.mjs and NormandyApi.sys.mjs
 * do not exist on Android. app.shield.optoutstudies.enabled is NOT here -- it is
 * also read by toolkit/components/nimbus/ExperimentAPI.sys.mjs, which does ship
 * on Android, so it stayed in common.cfg.
 */
// opt-out of normandy
lockPref("app.normandy.enabled", false);
lockPref("app.normandy.api_url", "");

/** [157] WHY DESKTOP: identity.fxaccounts.* is [fxa] (reader
 * browser/components/AccountsGlue.sys.mjs); the two activity-stream prefs are
 * newtab; browser.referrals.* is browser/components/referrals plus [messaging].
 */
// Disable Firefox account ping
lockPref("identity.fxaccounts.telemetry.clientInfoPing.enabled", false);
// Disable newtab ping
lockPref("browser.newtabpage.activity-stream.telemetry.privatePing.enabled", false);
// Set random ID
lockPref("browser.newtabpage.activity-stream.impressionId", "{some-fake-impression-ID}");

// Disable the Firefox Referral program
lockPref("browser.referrals.enabled", false);
lockPref("browser.referrals.pingSubmitted", true);
lockPref("browser.referrals.code", "");

/** [157] WHY DESKTOP: not because Android lacks a reader -- because it has one
 * and did not ship these. Upstream puts both in its shared cfg. Android builds
 * from 153 ESR and must keep its shipped behaviour until its owner approves a
 * change, and neither can be undone from android.cfg: autoconfig cannot delete
 * a default value or unset an environment variable.
 *
 * toolkit.profiles.newProfileSubmitted: read by
 * toolkit/profile/nsToolkitProfileService.cpp on both trees; locking it true
 * suppresses the new-profile Glean ping and its quit-application observer.
 *
 * MOZ_CRASHREPORTER_DISABLE: NOT A PREF, set through
 * patches/autoconfig-setEnv.patch. On Android GeckoThread.java already sets it
 * for release builds without a native crash reporter, and
 * assets/mozconfig.android passes --disable-crashreporter.
 */
lockPref("toolkit.profiles.newProfileSubmitted", true);
setEnv("MOZ_CRASHREPORTER_DISABLE", 1); // https://searchfox.org/firefox-main/rev/6d751cf5d0af4b7fcc1b232b6c2ba0551afabe1d/mozglue/misc/RuntimeExceptionModule.cpp#98-102

/** ------------------------------
 * [CATEGORY] WINDOWS
 * the prefs in this section only apply to windows installations and they don't have any
 * effect on linux, macos and bsd users.
 *
 * WHY DESKTOP: this is the easy category. app.update.service.enabled is the
 * Windows maintenance service (toolkit/moz.build:44-49, MOZ_MAINTENANCE_SERVICE);
 * default-browser-agent.enabled gates toolkit/mozapps/defaultagent, which
 * toolkit/moz.build:31-35 builds only for OS_ARCH == WINNT and reads at
 * toolkit/xre/nsAppRunner.cpp:284; browser.startup.windowsLaunchOnLogin.defaultEnabled
 * is browser/components/defaultwindowslaunchonlogin; and the clearPref undoes a
 * Windows-only registry pref (toolkit/xre/nsAppRunner.h). None of the four has
 * any meaning on Android.
 * ------------------------------- */

/** [SECTION] UPDATES
 * disable windows specific update services.
 */
lockPref("app.update.service.enabled", false);

/** [SECTION] OTHERS */
lockPref("default-browser-agent.enabled", false); // disable windows specific telemetry
defaultPref("browser.startup.windowsLaunchOnLogin.defaultEnabled", false); // prevent autorun from automatically being enabled for new profiles and at each portable launch (since v152)
clearPref("toolkit.winRegisterApplicationRestart"); // clear previous pref setting https://codeberg.org/librewolf/issues/issues/3056
defaultPref("browser.startup.windowsLaunchOnLogin.disableLaunchOnLoginPrompt", true); // Disable launch on login infobar notification

// Disable alternative icons, until we ship our own.
// This is currently Windows only.
lockPref("browser.shell.customIcon.enabled", false);

// Make notification helper available, but disabled by default
defaultPref("app.backgroundNotifications.helper.available", true);
defaultPref("app.backgroundNotifications.helper.enabled", false);

/** ------------------------------
 * [CATEGORY] MACOS
 * the prefs in this section only apply to macOS installations and they don't have any
 * effect on linux, windows and bsd users.
 * ------------------------------- */
// Disable Set as Default Browser menu item in app menu
defaultPref("browser.macAppMenu.setAsDefaultShown", false);

