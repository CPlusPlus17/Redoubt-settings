 */
defaultPref("browser.tabs.searchclipboardfor.middleclick", false); // prevent mouse middle click on new tab button to trigger searches or page loads

/** [SECTION] MACHINE LEARNING
 * WHY DESKTOP, per pref (the browser.smartwindow.*, linkPreview.blockListEnabled
 * and ai.control.speechRecognition lines are [157]: browser/components/aiwindow,
 * browser/components/genai/LinkPreviewModel.sys.mjs and
 * browser/components/preferences + enterprisepolicies respectively):
 *   browser.ml.chat.menu                   browser/components/genai/GenAI.sys.mjs
 *   browser.ml.linkPreview.supportedLocales browser/components/genai/*
