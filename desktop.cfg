/** [SECTION] ABOUT
 * remove annoying ui elements from the about pages, including about:protections
 *
 * WHY DESKTOP: about:protections is browser/components/protections/*. The
 * toolkit/modules/RemotePageAccessManager.sys.mjs:242 entries are that page's
 * RPM allowlist, not an independent reader. browser.vpn_promo.enabled reaches
 * Gecko only through
 * BrowserUtils.shouldShowPromo, whose callers are
 * browser/components/protections/* and browser/components/asrouter/ASRouter.sys.mjs
 * [messaging]. browser.topsites.* are browser/extensions/newtab +
 * browser/components/topsites.
 * -> android.cfg gap: Fenix has its own sponsored top sites (contile) driven
 *    from Kotlin, not from browser.topsites.contile.enabled -- M4 owns it.
 * [157] browser.ipProtection.upgradeNotAvailable: browser/components/ipprotection.
 *    browser.shell.*: browser/components/shell. (browser.promo.focus.enabled was
 *    removed from Firefox 155 and from upstream's cfg.)
 */
defaultPref("browser.contentblocking.report.lockwise.enabled", false);
lockPref("browser.contentblocking.report.hide_vpn_banner", true);
lockPref("browser.contentblocking.report.show_mobile_app", false);
lockPref("browser.vpn_promo.enabled", false);
lockPref("browser.ipProtection.upgradeNotAvailable", true);
// ...about:preferences#home
defaultPref("browser.topsites.useRemoteSetting", false); // hide sponsored shortcuts button
defaultPref("browser.topsites.contile.enabled", false);

// Disable Firefox branding
defaultPref("browser.shell.displayKitImageBehindSetDefaultBrowserButton", "off");

/** [SECTION] ASROUTER
 * Disable Messaging System
 * https://firefox-source-docs.mozilla.org/browser/components/asrouter/docs/index.html
 *
 * WHY DESKTOP: ASRouter is browser/components/asrouter and [messaging] keeps
 * toolkit/components/messaging-system out of the Android build entirely. The
 * only non-browser/ mention,
 * toolkit/components/backgroundtasks/defaults/backgroundtasks_browser.js, is a
 * desktop background-task profile.
 * -> android.cfg gap: Fenix's message surface is Nimbus Messaging in Kotlin.
 *    LW-M4 removes it; no pref here can.
 */
// https://searchfox.org/firefox-main/rev/202150dcdade5798ca858b843b51b20112b4d061/toolkit/components/backgroundtasks/defaults/backgroundtasks_browser.js#26-30
lockPref("browser.newtabpage.activity-stream.asrouter.providers.cfr", "null");
lockPref("browser.newtabpage.activity-stream.asrouter.providers.message-groups", "null");
lockPref("browser.newtabpage.activity-stream.asrouter.providers.messaging-experiments", "null");
lockPref("browser.newtabpage.activity-stream.asrouter.providers.onboarding", "null");

/** [SECTION] OTHERS
 * other unwanted UI
 *
 * WHY DESKTOP:
 *   identity.fxaccounts.toolbar.pxiToolbarEnabled  browser/base/content/browser-sync.js
 *   sidebar.main.tools                             browser/components/sidebar/*
 *   browser.preferences.experimental.hidden        browser/components/preferences/*
 *   browser.urlbar.trustPanel.breachAlerts*        browser/components/preferences/config/privacy.mjs
 * All four are desktop chrome. There is no toolbar, sidebar, about:preferences
 * or trust panel in GeckoView.
 * [157] the rest -- trackerCount*, browser.promo.*, share-button,
 * browser.uiCustomization.state and browser.toolbarbuttons.introduced.* -- are
 * urlbar, asrouter/promo and CustomizableUI prefs, all under browser/.
 * (browser.vpn_promo.enabled, which upstream also sets as a defaultPref here, is
