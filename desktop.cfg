/** LIBREWOLF SETTINGS -- DESKTOP
 *
 * ---------------------------------------------------------------------------
 * THIS IS A FRAGMENT, NOT A STANDALONE .cfg
 * ---------------------------------------------------------------------------
 *
 * It is concatenated AFTER common.cfg to produce librewolf.cfg. It has no
 * sacrificial first line of its own (autoconfig discards the first line of the
 * file it is given), so never hand it to nsReadConfig on its own.
 *
 * ---------------------------------------------------------------------------
 * THE BAR FOR BEING IN THIS FILE
 * ---------------------------------------------------------------------------
 *
 * A pref belongs here only when it is *genuinely inert on Android*: the code
 * that reads it is not compiled, not traversed, or not reachable there. Every
 * entry below carries the citation that establishes that, against the pristine
 * firefox-153.0.4 tree. "Sounds desktop-flavoured" is not a reason -- a common
 * pref wrongly moved here is a silent privacy regression on Android, while a
 * desktop pref wrongly left in common.cfg is merely inert.
 *
 * Several of these describe behaviour Android still wants. They are desktop
 * *implementations*, not desktop *requirements*. Those cases are recorded as
 * gaps in android.cfg so they show up in the M5 parity matrix rather than
 * disappearing.
 *
 * Recurring citations, so they are not repeated 30 times:
 *
 *   [browser/]      browser/app.mozbuild:11 is the only thing that pulls
 *                   browser/ in; mobile/android/app.mozbuild never does.
 *   [messaging]     toolkit/components/moz.build:142 adds "messaging-system"
 *                   and "normandy" only when MOZ_BUILD_APP == "browser".
 *   [devtools/client] devtools/moz.build:5-8 adds client/ only when
 *                   MOZ_DEVTOOLS == "all", implied only by
 *                   browser/moz.configure:17 (landmine L3).
 *   [fxa]           services/moz.build:22-26 excludes fxaccounts on Android;
 *                   MOZ_SERVICES_SYNC is implied only by browser/moz.configure:7.
 */

/** ------------------------------
 * [CATEGORY] PRIVACY
 * ------------------------------- */

/** [SECTION] SANITIZING
 * all the cleaning prefs true by default except for siteSettings which is what
 * we want. users should set manual exceptions in the UI if there are cookies
 * they want to keep.
 *
 * WHY DESKTOP: the component that performs the shutdown sanitize is
 * browser/modules/Sanitizer.sys.mjs [browser/]. privacy.sanitize.timeSpan,
 * both privacy.clearOnShutdown_v2.* prefs and the hasMigratedToNewPrefs3
 * migration flag have no reader outside browser/ at all.
 *
 * privacy.sanitize.sanitizeOnShutdown does have one shared reader --
 * toolkit/components/antitracking/PurgeTrackerService.sys.mjs:300-331 -- and it
 * is a reason to keep it OFF Android rather than a reason to ship it there:
 * that code CANCELS tracker-cookie purging when sanitizeOnShutdown is true and
 * privacy.clearOnShutdown.history or .siteSettings is true. Those two are
 * declared only in browser/app/profile/firefox.js:1233,1240, so today they read
 * false on Android and the cancel does not fire -- but shipping
 * sanitizeOnShutdown=true there would buy nothing (no Sanitizer) while arming
 * that trap for the day something sets them. (CookieService.cpp:66-92 only
 * *writes* these prefs, inside the network.cookie.lifetimePolicy migration.)
 */
// Sanitize on Shutdown, see: https://support.mozilla.org/en-US/questions/1275887
defaultPref("privacy.sanitize.sanitizeOnShutdown", true);
defaultPref("privacy.sanitize.timeSpan", 0);
defaultPref("privacy.clearOnShutdown_v2.historyFormDataAndDownloads", false);
defaultPref("privacy.clearOnShutdown_v2.browsingHistoryAndDownloads", false);
// The sanitation settings have actually changed..
defaultPref("privacy.sanitize.clearOnShutdown.hasMigratedToNewPrefs3", true);

/** [SECTION] CACHE AND STORAGE */
// WHY DESKTOP: the only reader is widget/windows/nsDataObj.cpp:1424 (favicons
// written next to Windows shell shortcuts). There is no shell shortcut and no
// widget/windows on Android.
defaultPref("browser.shell.shortcutFavicons", false); // disable favicons in profile folder

/** [SECTION] HISTORY AND SESSION RESTORE */
// WHY DESKTOP: read only by browser/components/preferences/config/privacy.mjs,
// the "Remember history / Never remember / Use custom settings" dropdown. That
// preferences pane does not exist on Android; Fenix has its own privacy screen.
pref("privacy.history.custom", true);

/** ------------------------------
 * [CATEGORY] NETWORKING
 * ------------------------------- */

/** [SECTION] PREFETCHING AND SPECULATIVE CONNECTIONS
 * WHY DESKTOP: browser/components/places/PlacesUIUtils.sys.mjs:1660 and
 * browser/components/urlbar/* respectively. Both the Places UI and the urlbar
 * are browser/-only; Fenix's awesomebar is Kotlin and does its speculative
 * connects through Engine.speculativeConnect(), which no Gecko pref gates.
 * -> android.cfg gap: awesomebar speculative connections.
 * The three netwerk-level prefetch prefs stayed in common.cfg.
 */
defaultPref("browser.places.speculativeConnect.enabled", false);
// disable speculative connections and domain guessing from the urlbar
defaultPref("browser.urlbar.speculativeConnect.enabled", false);

/** ------------------------------
 * [CATEGORY] FINGERPRINTING
 * ------------------------------- */

/** [SECTION] RFP -- window sizing and letterboxing
 *
 * increase the size of new RFP windows for better usability, while still using a rounded value.
 * if the screen resolution is lower it will stretch to the biggest possible rounded value.
 * also, expose hidden letterboxing pref but do not enable it for now.
 *
 * WHY DESKTOP, precisely -- the board's shorthand ("no windows to size on
 * Android") is the right call for the wrong mechanism, so here is the real one:
 *
 *   privacy.window.maxInner{Width,Height} are StaticPrefs read in core DOM,
 *   dom/base/nsContentUtils.cpp:3036-3047, not in desktop code. They are the
 *   ceiling in `std::min(maxInnerWidth, screenWidth - chromeWidth)` inside
 *   CalcRoundedWindowSizeForResistingFingerprinting. Its two callers are
 *   xpfe/appshell/AppWindow.cpp:1070 (XUL windows -- GeckoView creates none)
 *   and toolkit/components/windowwatcher/nsWindowWatcher.cpp:2446, which fires
 *   only for window.open() with an explicit size. On a phone the available
 *   width is far below the ceiling, so the min() always picks the screen and
 *   the pref never binds.
 *
 *   Note also that LibreWolf *raises* the width ceiling (Gecko's default is
 *   1400x900, StaticPrefList.yaml:17850) as a usability tweak. Not shipping it
 *   on Android leaves the tighter Mozilla value in place, so this is not a
 *   protection being dropped.
 *
 *   browser.toolbars.bookmarks.visibility is here for the same reason: it is
 *   set to "always" so the desktop chrome height is constant and the rounding
 *   above lands exactly (LibreWolf #1569). Its only non-browser/ reader is
 *   xpfe/appshell/AppWindow.cpp:1786, which needs a chrome document with a
 *   toolbar-menubar element.
 *
 *   privacy.resistFingerprinting.letterboxing is shipped FALSE and is here only
 *   so it stays visible in about:config next to the prefs it relates to.
 *   RFPHelper.sys.mjs drives letterboxing entirely through chrome DOM
 *   (browserParent.classList, chrome://global/content/resistfingerprinting/
 *   letterboxing.css), which GeckoView does not have.
 *   *** THIS IS NOT A PARITY ITEM. Desktop LibreWolf ships letterboxing off, so
 *   *** Android not having it costs our users nothing. Do NOT record it as an
 *   *** Android gap; earlier drafts of the plan did and it was wrong.
 */
defaultPref("privacy.window.maxInnerWidth", 1600);
defaultPref("privacy.window.maxInnerHeight", 900);
defaultPref("privacy.resistFingerprinting.letterboxing", false);
// this ensures there is no rounding error when computing the window size, see #1569.
defaultPref("browser.toolbars.bookmarks.visibility", "always");

/** ------------------------------
 * [CATEGORY] REGION
 * ------------------------------- */

/** [SECTION] LOCATION
 * WHY DESKTOP: each of these three is read inside a platform #ifdef in
 * dom/geolocation/Geolocation.cpp -- MOZ_WIDGET_GTK (use_geoclue, :757),
 * MOZ_WIDGET_COCOA (use_corelocation, :776) and XP_WIN (ms-windows-location,
 * :782). On Android the provider is chosen unconditionally at :742-744
 * (AndroidLocationProvider), so none of the three is ever consulted.
 *
 * geo.provider.network.url deliberately stayed in common.cfg -- see the note
 * there. It is the one that matters.
 */
defaultPref("geo.provider.ms-windows-location", false); // [WINDOWS]
defaultPref("geo.provider.use_corelocation", false); // [MAC]
defaultPref("geo.provider.use_geoclue", false); // [LINUX]

/** [SECTION] LANGUAGE
 * WHY DESKTOP: both are read only by the about:preferences language pane --
 * browser/components/preferences/config/languages.mjs:16-17,200-204,
 * browser/components/preferences/main.js:797,1409 and
 * browser/components/preferences/dialogs/browserLanguages.js:406 [browser/].
 * Android switches locale through Fenix's own settings screen and
 * intl.locale.requested, which is in common.cfg.
 */
// Enable support for locale switching
/// (Our builds are multi-locale...)
/// (For reference, Mozilla also enables this explicitly for some of their multi-locale builds, ex:
/// https://searchfox.org/firefox-main/rev/a7628a66/browser/installer/windows/msix/distribution/distribution.ini#12)
defaultPref("intl.multilingual.enabled", true);
defaultPref("intl.multilingual.downloadEnabled", false);

/** ------------------------------
 * [CATEGORY] BEHAVIOR
 * ------------------------------- */

/** [SECTION] DRM
 * WHY DESKTOP: the only reader is the learn-more link in
 * browser/modules/EMEPermissionPrompt.sys.mjs, added by
 * patches/eme-permission-desktop.patch. The common half of that straddler
 * (patches/eme-permission-common.patch) does not use it -- Android answers the
 * same media-key-system-access request through GeckoViewPermission and Fenix's
 * own site-permission prompt, which has no learn-more URL to point anywhere.
 */
defaultPref("librewolf.eme.warning.infoURL", "https://librewolf.net/docs/faq/#how-do-i-allow-playback-of-drm-controlled-content-when-should-i-allow-it");

/** [SECTION] SEARCH AND URLBAR
 * WHY DESKTOP: every pref below is read by browser/components/urlbar/* or
 * browser/components/preferences/config/search.mjs [browser/], except
 * browser.search.serpEventTelemetryCategorization.enabled, which is
 * browser/components/search/SERPCategorization.sys.mjs and
 * browser/actors/SearchSERPTelemetryChild.sys.mjs. Firefox Suggest, the
 * quick-suggest feature gates and the SERP categoriser are all desktop urlbar
 * features; Fenix's awesomebar is a separate Kotlin implementation.
 *
 * The thing that actually keeps queries on the device -- browser.search.suggest.enabled
 * -- is in common.cfg and is set by mobile/android/app/geckoview-prefs.js too.
 * -> android.cfg gap: Fenix search-suggestion and sponsored-suggestion surfaces
 *    are M4 work, not pref work.
 */
defaultPref("browser.urlbar.suggest.searches", false);
defaultPref("browser.search.serpEventTelemetryCategorization.enabled", false);

defaultPref("browser.urlbar.suggest.mdn", true);
defaultPref("browser.urlbar.addons.featureGate", false);
defaultPref("browser.urlbar.mdn.featureGate", false);
defaultPref("browser.urlbar.trending.featureGate", false);
defaultPref("browser.urlbar.weather.featureGate", false);
defaultPref("browser.urlbar.importantDates.featureGate", false);
defaultPref("browser.urlbar.market.featureGate", false);
defaultPref("browser.urlbar.yelp.featureGate", false);
defaultPref("browser.urlbar.yelpRealtime.featureGate", false);

/** the pref disables the whole feature and hide it from the ui
 * (as noted in https://bugzilla.mozilla.org/show_bug.cgi?id=1755057).
 * this also includes the best match feature, as it is part of firefox suggest.
 */
pref("browser.urlbar.quicksuggest.enabled", false);
defaultPref("browser.urlbar.suggest.weather", false); // disable weather suggestions in urlbar once they are no longer behind feature gate

/** [SECTION] DOWNLOADS
 * WHY DESKTOP: the download button lives in the desktop toolbar
 * (browser/components/customizableui/*, browser/components/downloads/content/indicator.js)
 * and the downloads panel in browser/components/downloads/DownloadsCommon.sys.mjs.
 * toolkit/components/downloads/DownloadCore.sys.mjs:286 mentions alwaysOpenPanel
 * only in a comment. Android's download UI is Fenix's own notification/menu.
 * The download prefs with toolkit readers stayed in common.cfg.
 */
defaultPref("browser.download.autohideButton", false); // do not hide download button automatically
defaultPref("browser.download.alwaysOpenPanel", false); // do not expand toolbar menu for every download, we already have enough interaction

/** [SECTION] MOUSE
 * WHY DESKTOP: browser/base/content/browser.js is the only reader, and there is
 * no mouse middle-click on a touchscreen.
 */
defaultPref("browser.tabs.searchclipboardfor.middleclick", false); // prevent mouse middle click on new tab button to trigger searches or page loads

/** [SECTION] MACHINE LEARNING
 * WHY DESKTOP, per pref:
 *   browser.ml.chat.menu                   browser/components/genai/GenAI.sys.mjs
 *   browser.ml.linkPreview.supportedLocales browser/components/genai/*
 *   browser.tabs.groups.smart.enabled      browser/components/tabbrowser/SmartTabGrouping.sys.mjs
 *                                          + browser/components/preferences/*
 *   browser.preferences.aiControls         browser/components/preferences/preferences.js
 *                                          + config/aiFeatures.mjs
 * All four are desktop chrome surfaces. browser.ml.enable itself,
 * extensions.ui.mlmodel.hidden and browser.ai.control.default are in common.cfg
 * -- the first two because toolkit reads them, the third because
 * toolkit/components/nimbus does and nimbus ships on Android.
 */
// some leftover menu still appears otherwise:
defaultPref("browser.ml.chat.menu", false);
defaultPref("browser.ml.linkPreview.supportedLocales", "null");
// disable smart tab groups
defaultPref("browser.tabs.groups.smart.enabled", false);

// Removes the AI pane
lockPref("browser.preferences.aiControls", false);

/** ------------------------------
 * [CATEGORY] EXTENSIONS
 * ------------------------------- */

/** [SECTION] SYSTEM
 * The reporter extension of webcompat is disabled, urls are stripped for defense in depth.
 *
 * WHY DESKTOP: the extension these gate is browser/extensions/webcompat, wired
 * up by browser/components/BrowserGlue.sys.mjs:906 [browser/]. Android ships a
 * different one entirely --
 * mobile/android/android-components/components/feature/webcompat-reporter,
 * installed from Kotlin -- and it does not read either pref.
 * -> android.cfg gap: feature-webcompat-reporter is M4 removal work.
 */
lockPref("extensions.webcompat-reporter.enabled", false);
lockPref("extensions.webcompat-reporter.newIssueEndpoint", "");

/** [SECTION] EXTENSION FIREWALL
 * WHY DESKTOP: about:debugging's add-on pane is devtools/client/aboutdebugging
 * [devtools/client]. devtools/startup, server and shared do ship on Android --
 * that is why devtools.selfxss.count and devtools.debugger.remote-enabled are
 * in common.cfg -- but client/ does not.
 */
defaultPref("devtools.aboutdebugging.showHiddenAddons", true); // Disabled for non MOZILLA_OFFICIAL builds

/** ------------------------------
 * [CATEGORY] BUILT-IN FEATURES
 * ------------------------------- */

/** [SECTION] SYNC
 * this functionality is disabled by default but it can be activated in one click.
 * this pref fully controls the feature, including its ui.
 *
 * WHY DESKTOP: [fxa]. services/fxaccounts is not built on Android and neither
 * is services/sync, so FxAccounts.sys.mjs and Weave.sys.mjs -- the two readers
 * outside browser/ -- do not exist there.
 * -> android.cfg gap: Fenix's account and sync stack is Kotlin over
 *    application-services and is untouched by this pref. It has to be removed
 *    or disabled in the Kotlin layer (M4).
 */
defaultPref("identity.fxaccounts.enabled", false);

/** [SECTION] CONTAINERS
 * WHY DESKTOP: this one only reveals the containers UI, and its readers are
 * browser/components/preferences/config/tabs-browsing.mjs:61,308 [browser/].
 * toolkit/components/extensions/parent/ext-contextualIdentities.js:136 writes
 * it, never reads it. privacy.userContext.enabled -- the feature switch, read
 * by toolkit/components/contextualidentity -- stayed in common.cfg.
 */
defaultPref("privacy.userContext.ui.enabled", true);

/** [SECTION] DEVTOOLS / SHARING
 * WHY DESKTOP: browser/components/qrcode/QRCodeGenerator.sys.mjs. Fenix
 * generates its own QR codes in Kotlin.
 */
defaultPref("browser.shareqrcode.embed_logo", false); // Don't embed logo in QR codes

/** ------------------------------
 * [CATEGORY] UI
 * ------------------------------- */

/** [SECTION] BRANDING
 * WHY DESKTOP:
 *   browser.geolocation.warning.infoURL  browser/modules/PermissionUI.sys.mjs --
 *                                        the desktop geolocation doorhanger.
 *                                        Android prompts through
 *                                        GeckoViewPermission + Fenix.
 *   app.feedback.baseURL                 browser/base/content/utilityOverlay.js
 *                                        (Help > Submit Feedback). The only
 *                                        other mention is
 *                                        TelemetryEnvironment.sys.mjs:224,
 *                                        which merely RECORDs the value into a
 *                                        ping we do not send.
 *   app.releaseNotesURL.aboutDialog      browser/base/content/aboutDialog.js.
 *                                        The plain app.releaseNotesURL, which
 *                                        toolkit/content/about.js reads, is in
 *                                        common.cfg.
 */
defaultPref(
  "browser.geolocation.warning.infoURL",
  "https://librewolf.net/docs/faq/#how-do-i-enable-location-aware-browsing"
);
defaultPref("app.feedback.baseURL", "https://librewolf.net/#questions");
defaultPref(
  "app.releaseNotesURL.aboutDialog",
  "https://codeberg.org/librewolf/source"
);

/** [SECTION] FIRST LAUNCH
 * disable what's new, ui tour, and privacy notice/terms of use on first start and updates. the browser
 * should also not stress user about being the default one.
 *
 * WHY DESKTOP:
 *   browser.startup.homepage_override.mstone   browser/components/BrowserContentHandler.sys.mjs
 *   startup.homepage_override_nimbus_disable_wnp  same file (the What's New Page)
 *   startup.homepage_welcome_url[.additional]  same file + browser/branding/*
 *   browser.uitour.enabled / .url              browser/components/uitour, registered
 *                                              by browser/components/DesktopActorRegistry.sys.mjs
 * None of these has a reader outside browser/. Android's first-run surface is
 * Fenix onboarding.
 * -> android.cfg gap: Fenix onboarding is M4 work (it is a Kotlin screen, not a
 *    homepage override).
 *
 * The datareporting.policy.* and termsofuse.bypassNotification prefs from this
 * section stayed in common.cfg -- toolkit/components/telemetry reads them and
 * telemetry ships on Android.
 */
defaultPref("browser.startup.homepage_override.mstone", "ignore");
lockPref("browser.uitour.enabled", false);
lockPref("browser.uitour.url", "");
lockPref("startup.homepage_override_nimbus_disable_wnp", true);
defaultPref("startup.homepage_welcome_url", "about:blank");
defaultPref("startup.homepage_welcome_url.additional", "");

/** [SECTION] NEW TAB PAGE
 * we want NTP to display nothing but the search bar without anything distracting.
 * the three prefs below are just for minimalism and they should be easy to revert for users.
 *
 * WHY DESKTOP: activity-stream is browser/extensions/newtab plus
 * browser/modules/AboutNewTab.sys.mjs [browser/]. Android's home screen is
 * Fenix's own composable; nothing under mobile/ reads any
 * browser.newtabpage.activity-stream.* pref.
 * -> android.cfg gap: Fenix home-screen telemetry and top sites are M4 work.
 */
defaultPref(
  "browser.newtabpage.activity-stream.section.highlights.includeDownloads",
  false
);
defaultPref(
  "browser.newtabpage.activity-stream.section.highlights.includeVisited",
  false
);
// disable telemetry in Firefox Home
lockPref("browser.newtabpage.activity-stream.feeds.telemetry", false);
lockPref("browser.newtabpage.activity-stream.telemetry", false);
lockPref("browser.newtabpage.activity-stream.default.sites", "");
// disable weather info fetching (ticket #2048)
defaultPref("browser.newtabpage.activity-stream.feeds.weatherfeed", false);

/** [SECTION] ABOUT
 * remove annoying ui elements from the about pages, including about:protections
 *
 * WHY DESKTOP: about:protections is browser/components/protections/*. The
 * toolkit/modules/RemotePageAccessManager.sys.mjs:242 entries are that page's
 * RPM allowlist, not an independent reader. browser.vpn_promo.enabled and
 * browser.promo.focus.enabled reach Gecko only through
 * BrowserUtils.shouldShowPromo, whose callers are
 * browser/components/protections/* and browser/components/asrouter/ASRouter.sys.mjs
 * [messaging]. browser.topsites.* are browser/extensions/newtab +
 * browser/components/topsites.
 * -> android.cfg gap: Fenix has its own sponsored top sites (contile) driven
 *    from Kotlin, not from browser.topsites.contile.enabled -- M4 owns it.
 */
defaultPref("browser.contentblocking.report.lockwise.enabled", false);
lockPref("browser.contentblocking.report.hide_vpn_banner", true);
lockPref("browser.contentblocking.report.show_mobile_app", false);
lockPref("browser.vpn_promo.enabled", false);
lockPref("browser.promo.focus.enabled", false);
// ...about:preferences#home
defaultPref("browser.topsites.useRemoteSetting", false); // hide sponsored shortcuts button
defaultPref("browser.topsites.contile.enabled", false);

/** [SECTION] ASROUTER
 * Disable Messaging System
 * https://firefox-source-docs.mozilla.org/browser/components/asrouter/docs/index.html
 *
 * WHY DESKTOP: ASRouter is browser/components/asrouter and [messaging] keeps
 * toolkit/components/messaging-system out of the Android build entirely. The
 * only non-browser/ mention,
 * toolkit/components/backgroundtasks/defaults/backgroundtasks_browser.js, is a
 * desktop background-task profile.
 * -> android.cfg gap: Fenix's message surface is Nimbus Messaging in Kotlin.
 *    LW-M4 removes it; no pref here can.
 */
// https://searchfox.org/firefox-main/rev/202150dcdade5798ca858b843b51b20112b4d061/toolkit/components/backgroundtasks/defaults/backgroundtasks_browser.js#26-30
lockPref("browser.newtabpage.activity-stream.asrouter.providers.cfr", "null");
lockPref("browser.newtabpage.activity-stream.asrouter.providers.message-groups", "null");
lockPref("browser.newtabpage.activity-stream.asrouter.providers.messaging-experiments", "null");
lockPref("browser.newtabpage.activity-stream.asrouter.providers.onboarding", "null");

/** [SECTION] OTHERS
 * other unwanted UI
 *
 * WHY DESKTOP:
 *   identity.fxaccounts.toolbar.pxiToolbarEnabled  browser/base/content/browser-sync.js
 *   sidebar.main.tools                             browser/components/sidebar/*
 *   browser.preferences.experimental.hidden        browser/components/preferences/*
 *   browser.urlbar.trustPanel.breachAlerts*        browser/components/preferences/config/privacy.mjs
 * All four are desktop chrome. There is no toolbar, sidebar, about:preferences
 * or trust panel in GeckoView.
 */
// hide pxi ads on toolbar firefox sync button
lockPref("identity.fxaccounts.toolbar.pxiToolbarEnabled", false);
// remove the "send to device" tab by default from opt-in sidebar layout
defaultPref("sidebar.main.tools", "history");

// Avoids the "Firefox Labs" section from shortly appearing on first launch
defaultPref("browser.preferences.experimental.hidden", true);

// Disable breach alerts for the time being
defaultPref("browser.urlbar.trustPanel.breachAlerts.featureGate", false);
defaultPref("browser.urlbar.trustPanel.breachAlerts", false);

/** ------------------------------
 * [CATEGORY] TELEMETRY
 * ------------------------------- */

/** WHY DESKTOP: [messaging]. toolkit/components/normandy is only added to DIRS
 * for MOZ_BUILD_APP == "browser", so RecipeRunner.sys.mjs and NormandyApi.sys.mjs
 * do not exist on Android. app.shield.optoutstudies.enabled is NOT here -- it is
 * also read by toolkit/components/nimbus/ExperimentAPI.sys.mjs, which does ship
 * on Android, so it stayed in common.cfg.
 */
// opt-out of normandy
lockPref("app.normandy.enabled", false);
lockPref("app.normandy.api_url", "");

/** ------------------------------
 * [CATEGORY] WINDOWS
 * the prefs in this section only apply to windows installations and they don't have any
 * effect on linux, macos and bsd users.
 *
 * WHY DESKTOP: this is the easy category. app.update.service.enabled is the
 * Windows maintenance service (toolkit/moz.build:44-49, MOZ_MAINTENANCE_SERVICE);
 * default-browser-agent.enabled gates toolkit/mozapps/defaultagent, which
 * toolkit/moz.build:31-35 builds only for OS_ARCH == WINNT and reads at
 * toolkit/xre/nsAppRunner.cpp:284; browser.startup.windowsLaunchOnLogin.defaultEnabled
 * is browser/components/defaultwindowslaunchonlogin; and the clearPref undoes a
 * Windows-only registry pref (toolkit/xre/nsAppRunner.h). None of the four has
 * any meaning on Android.
 * ------------------------------- */

/** [SECTION] UPDATES
 * disable windows specific update services.
 */
lockPref("app.update.service.enabled", false);

/** [SECTION] OTHERS */
lockPref("default-browser-agent.enabled", false); // disable windows specific telemetry
defaultPref("browser.startup.windowsLaunchOnLogin.defaultEnabled", false); // prevent autorun from automatically being enabled for new profiles and at each portable launch (since v152)
clearPref("toolkit.winRegisterApplicationRestart"); // clear previous pref setting https://codeberg.org/librewolf/issues/issues/3056

/** ------------------------------
 * [CATEGORY] LIBREWOLF
 * prefs introduced by librewolf-specific patches whose patch file is in
 * assets/patches/desktop.txt, so the code that reads them is never in an
 * Android tree.
 * ------------------------------- */
// themes/browser/base/content/aboutDialog.js:44 -- the desktop About dialog,
// copied into browser/ by scripts/librewolf-patches.py:334.
defaultPref("librewolf.aboutMenu.checkVersion", false);
// patches/hide-passwordmgr.patch (desktop.txt)
defaultPref("librewolf.hidePasswdmgr", false);
// Added via patches/moz-official.patch -- now patches/moz-official-desktop.patch
// (desktop.txt). Its three hunks are all browser/base; the common half of that
// straddler does not use this pref. moz-official-desktop.patch's own header
// records that no Android counterpart is needed.
defaultPref("librewolf.devHelpers", false);

/** ------------------------------
 * [CATEGORY] OVERRIDES
 * allow settings to be overriden with a file placed in the right location
 * https://librewolf.net/docs/settings/#where-do-i-find-my-librewolfoverridescfg
 * Moved to patches/profile-directory.patch
 *
 * (That patch is in common.txt, but the paths it builds come from
 * XDG_CONFIG_HOME / HOME / USERPROFILE and it runs from prefcalls.js, which
 * Android never executes. An Android override channel, if we want one, is a
 * separate design -- it is not this.)
 * ------------------------------- */
