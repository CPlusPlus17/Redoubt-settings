/** LIBREWOLF SETTINGS -- DESKTOP
 *
 * ---------------------------------------------------------------------------
 * THIS IS A FRAGMENT, NOT A STANDALONE .cfg
 * ---------------------------------------------------------------------------
 *
 * It is concatenated AFTER common.cfg to produce librewolf.cfg. It has no
 * sacrificial first line of its own (autoconfig discards the first line of the
 * file it is given), so never hand it to nsReadConfig on its own.
 *
 * ---------------------------------------------------------------------------
 * THE BAR FOR BEING IN THIS FILE
 * ---------------------------------------------------------------------------
 *
 * A pref belongs here only when it is *genuinely inert on Android*: the code
 * that reads it is not compiled, not traversed, or not reachable there. Every
 * entry below carries the citation that establishes that, against the pristine
 * firefox-153.0.4 tree. "Sounds desktop-flavoured" is not a reason -- a common
 * pref wrongly moved here is a silent privacy regression on Android, while a
 * desktop pref wrongly left in common.cfg is merely inert.
 *
 * Several of these describe behaviour Android still wants. They are desktop
 * *implementations*, not desktop *requirements*. Those cases are recorded as
 * gaps in android.cfg so they show up in the M5 parity matrix rather than
 * disappearing.
 *
 * Recurring citations, so they are not repeated 30 times:
 *
 *   [browser/]      browser/app.mozbuild:11 is the only thing that pulls
 *                   browser/ in; mobile/android/app.mozbuild never does.
 *   [messaging]     toolkit/components/moz.build:142 adds "messaging-system"
 *                   and "normandy" only when MOZ_BUILD_APP == "browser".
 *   [devtools/client] devtools/moz.build:5-8 adds client/ only when
 *                   MOZ_DEVTOOLS == "all", implied only by
 *                   browser/moz.configure:17 (landmine L3).
 *   [fxa]           services/moz.build:22-26 excludes fxaccounts on Android;
 *                   MOZ_SERVICES_SYNC is implied only by browser/moz.configure:7.
 *   [157]           added with the Firefox 157 merge. These prefs do not exist
 *                   in the 153 ESR tree Android builds from; their readers were
 *                   checked in firefox-157.0 and live only under browser/ (or in
 *                   the desktop-only modules cited above).
 */

/** ------------------------------
 * [CATEGORY] PRIVACY
 * ------------------------------- */

/** [SECTION] SANITIZING
 * all the cleaning prefs true by default except for siteSettings which is what
 * we want. users should set manual exceptions in the UI if there are cookies
 * they want to keep.
 *
 * WHY DESKTOP: the component that performs the shutdown sanitize is
 * browser/modules/Sanitizer.sys.mjs [browser/]. privacy.sanitize.timeSpan,
 * both privacy.clearOnShutdown_v2.* prefs and the hasMigratedToNewPrefs3
 * migration flag have no reader outside browser/ at all.
 *
 * privacy.sanitize.sanitizeOnShutdown does have one shared reader --
 * toolkit/components/antitracking/PurgeTrackerService.sys.mjs:300-331 -- and it
 * is a reason to keep it OFF Android rather than a reason to ship it there:
 * that code CANCELS tracker-cookie purging when sanitizeOnShutdown is true and
 * privacy.clearOnShutdown.history or .siteSettings is true. Those two are
 * declared only in browser/app/profile/firefox.js:1233,1240, so today they read
 * false on Android and the cancel does not fire -- but shipping
 * sanitizeOnShutdown=true there would buy nothing (no Sanitizer) while arming
 * that trap for the day something sets them. (CookieService.cpp:66-92 only
 * *writes* these prefs, inside the network.cookie.lifetimePolicy migration.)
 */
// Sanitize on Shutdown, see: https://support.mozilla.org/en-US/questions/1275887
defaultPref("privacy.sanitize.sanitizeOnShutdown", true);
defaultPref("privacy.sanitize.timeSpan", 0);
defaultPref("privacy.clearOnShutdown_v2.historyFormDataAndDownloads", false);
defaultPref("privacy.clearOnShutdown_v2.browsingHistoryAndDownloads", false);
// The sanitation settings have actually changed..
defaultPref("privacy.sanitize.clearOnShutdown.hasMigratedToNewPrefs3", true);

/** [SECTION] CACHE AND STORAGE */
// WHY DESKTOP: the only reader is widget/windows/nsDataObj.cpp:1424 (favicons
// written next to Windows shell shortcuts). There is no shell shortcut and no
// widget/windows on Android.
defaultPref("browser.shell.shortcutFavicons", false); // disable favicons in profile folder

/** [SECTION] HISTORY AND SESSION RESTORE */
// WHY DESKTOP: read only by browser/components/preferences/config/privacy.mjs,
// the "Remember history / Never remember / Use custom settings" dropdown. That
// preferences pane does not exist on Android; Fenix has its own privacy screen.
pref("privacy.history.custom", true);

/** ------------------------------
 * [CATEGORY] NETWORKING
 * ------------------------------- */

/** [SECTION] PREFETCHING AND SPECULATIVE CONNECTIONS
 * WHY DESKTOP: browser/components/places/PlacesUIUtils.sys.mjs:1660 and
 * browser/components/urlbar/* respectively. Both the Places UI and the urlbar
 * are browser/-only; Fenix's awesomebar is Kotlin and does its speculative
 * connects through Engine.speculativeConnect(), which no Gecko pref gates.
 * -> android.cfg gap: awesomebar speculative connections.
 * The three netwerk-level prefetch prefs stayed in common.cfg.
 */
defaultPref("browser.places.speculativeConnect.enabled", false);
// disable speculative connections and domain guessing from the urlbar
defaultPref("browser.urlbar.speculativeConnect.enabled", false);

/** ------------------------------
 * [CATEGORY] FINGERPRINTING
 * ------------------------------- */

/** [SECTION] RFP -- window sizing and letterboxing
 *
 * increase the size of new RFP windows for better usability, while still using a rounded value.
 * if the screen resolution is lower it will stretch to the biggest possible rounded value.
 * also, expose hidden letterboxing pref but do not enable it for now.
 *
 * WHY DESKTOP, precisely -- the board's shorthand ("no windows to size on
 * Android") is the right call for the wrong mechanism, so here is the real one:
 *
 *   privacy.window.maxInner{Width,Height} are StaticPrefs read in core DOM,
 *   dom/base/nsContentUtils.cpp:3036-3047, not in desktop code. They are the
 *   ceiling in `std::min(maxInnerWidth, screenWidth - chromeWidth)` inside
 *   CalcRoundedWindowSizeForResistingFingerprinting. Its two callers are
 *   xpfe/appshell/AppWindow.cpp:1070 (XUL windows -- GeckoView creates none)
 *   and toolkit/components/windowwatcher/nsWindowWatcher.cpp:2446, which fires
 *   only for window.open() with an explicit size. On a phone the available
 *   width is far below the ceiling, so the min() always picks the screen and
 *   the pref never binds.
 *
 *   Note also that LibreWolf *raises* the width ceiling (Gecko's default is
 *   1400x900, StaticPrefList.yaml:17850) as a usability tweak. Not shipping it
 *   on Android leaves the tighter Mozilla value in place, so this is not a
 *   protection being dropped.
 *
 *   browser.toolbars.bookmarks.visibility is here for the same reason: it is
 *   set to "always" so the desktop chrome height is constant and the rounding
 *   above lands exactly (LibreWolf #1569). Its only non-browser/ reader is
 *   xpfe/appshell/AppWindow.cpp:1786, which needs a chrome document with a
 *   toolbar-menubar element.
 *
 *   privacy.resistFingerprinting.letterboxing is shipped FALSE and is here only
 *   so it stays visible in about:config next to the prefs it relates to.
 *   RFPHelper.sys.mjs drives letterboxing entirely through chrome DOM
 *   (browserParent.classList, chrome://global/content/resistfingerprinting/
 *   letterboxing.css), which GeckoView does not have.
 *   *** THIS IS NOT A PARITY ITEM. Desktop LibreWolf ships letterboxing off, so
 *   *** Android not having it costs our users nothing. Do NOT record it as an
 *   *** Android gap; earlier drafts of the plan did and it was wrong.
 */
defaultPref("privacy.window.maxInnerWidth", 1600);
defaultPref("privacy.window.maxInnerHeight", 900);
defaultPref("privacy.resistFingerprinting.letterboxing", false);
// this ensures there is no rounding error when computing the window size, see #1569.
defaultPref("browser.toolbars.bookmarks.visibility", "always");

/** ------------------------------
 * [CATEGORY] REGION
 * ------------------------------- */

/** [SECTION] LOCATION
 * WHY DESKTOP: each of these three is read inside a platform #ifdef in
 * dom/geolocation/Geolocation.cpp -- MOZ_WIDGET_GTK (use_geoclue, :757),
 * MOZ_WIDGET_COCOA (use_corelocation, :776) and XP_WIN (ms-windows-location,
 * :782). On Android the provider is chosen unconditionally at :742-744
 * (AndroidLocationProvider), so none of the three is ever consulted.
 *
 * geo.provider.network.url deliberately stayed in common.cfg -- see the note
 * there. It is the one that matters.
 */
defaultPref("geo.provider.ms-windows-location", false); // [WINDOWS]
defaultPref("geo.provider.use_corelocation", false); // [MAC]
defaultPref("geo.provider.use_geoclue", false); // [LINUX]

/** [SECTION] LANGUAGE
 * WHY DESKTOP: both are read only by the about:preferences language pane --
 * browser/components/preferences/config/languages.mjs:16-17,200-204,
 * browser/components/preferences/main.js:797,1409 and
 * browser/components/preferences/dialogs/browserLanguages.js:406 [browser/].
 * Android switches locale through Fenix's own settings screen and
 * intl.locale.requested, which is in common.cfg.
 */
// Enable support for locale switching
/// (Our builds are multi-locale...)
/// (For reference, Mozilla also enables this explicitly for some of their multi-locale builds, ex:
/// https://searchfox.org/firefox-main/rev/a7628a66/browser/installer/windows/msix/distribution/distribution.ini#12)
defaultPref("intl.multilingual.enabled", true);
defaultPref("intl.multilingual.downloadEnabled", false);

/** ------------------------------
 * [CATEGORY] BEHAVIOR
 * ------------------------------- */

/** [SECTION] DRM
 * WHY DESKTOP: the only reader is the learn-more link in
 * browser/modules/EMEPermissionPrompt.sys.mjs, added by
 * patches/eme-permission-desktop.patch. The common half of that straddler
 * (patches/eme-permission-common.patch) does not use it -- Android answers the
 * same media-key-system-access request through GeckoViewPermission and Fenix's
 * own site-permission prompt, which has no learn-more URL to point anywhere.
 */
defaultPref("librewolf.eme.warning.infoURL", "https://librewolf.net/docs/faq/#how-do-i-allow-playback-of-drm-controlled-content-when-should-i-allow-it");

/* GMP manager, provider and Widevine.
 * WHY DESKTOP: toolkit/mozapps/extensions/internal/moz.build builds
 * GMPProvider.sys.mjs only for MOZ_WIDGET_TOOLKIT != "android", and
 * GMPInstallManager.sys.mjs (the only reader of the gmp-manager.* and
 * *-chromium-* prefs, via GMPUtils.sys.mjs) is called from GMPProvider and
 * browser/components/BrowserGlue.sys.mjs alone. Android's DRM is MediaDrm, not a
 * GMP. media.gmp-provider.enabled was false in common.cfg before the 157 merge;
 * upstream now ships it true with updates disabled.
 * media.eme.enabled: desktop also gets it from the EncryptedMediaExtensions
 * policy; android.cfg sets it separately (LW-M3-06), so it is not in common.cfg.
 */
defaultPref("media.gmp-manager.updateEnabled", false);
defaultPref("media.gmp-provider.enabled", true);
defaultPref("media.gmp-manager.allowLocalSources", false);

// Disable fetching Widevine from Chromium servers
defaultPref("media.gmp-widevinecdm.allow-chromium-update", false);
defaultPref("media.gmp-widevinecdm.force-chromium-update", false);
defaultPref("media.gmp-widevinecdm.force-chromium-beta", false);

// Widevine
defaultPref("media.eme.enabled", false);
defaultPref("media.gmp-widevinecdm.enabled", false);

/** [SECTION] SEARCH AND URLBAR
 * WHY DESKTOP: every pref below is read by browser/components/urlbar/* or
