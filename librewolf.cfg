/** librewolf does use DoH:
 *
 * the possible modes are:
 * 0 = default
 * 1 = browser picks faster
 * 2 = DoH with system dns fallback
 * 3 = DoH without fallback
 * 5 = DoH is off, default currently
 */

defaultPref("network.trr.mode", 5); // DoH is turned off. [ANDROID: LOCK] GeckoRuntimeSettings.java
defaultPref("network.trr.uri", "https://dns10.quad9.net/dns-query"); // Current 'reasonable default' proposal: NON-malware-blocking quad9 endpoint. [ANDROID: LOCK] GeckoRuntimeSettings.java + GeckoEngine.kt
defaultPref("doh-rollout.enabled", false); // Disable DoH rollout. NOT desktop-only: DoHConfig.sys.mjs:21,41 reads it as ${kGlobalPrefBranch}.${kEnabledPref} and toolkit/components/doh is in DIRS unconditionally
defaultPref("network.trr.useGET", false);

// Additions by Acideburn in https://codeberg.org/librewolf/issues/issues/1975
