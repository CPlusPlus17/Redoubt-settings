/** [SECTION] SANITIZING
 * all the cleaning prefs true by default except for siteSettings which is what
 * we want. users should set manual exceptions in the UI if there are cookies
 * they want to keep.
 *
 * WHY DESKTOP: the component that performs the shutdown sanitize is
 * browser/modules/Sanitizer.sys.mjs [browser/]. privacy.sanitize.timeSpan,
 * both privacy.clearOnShutdown_v2.* prefs and the hasMigratedToNewPrefs3
 * migration flag have no reader outside browser/ at all.
 *
 * privacy.sanitize.sanitizeOnShutdown does have one shared reader --
 * toolkit/components/antitracking/PurgeTrackerService.sys.mjs:300-331 -- and it
 * is a reason to keep it OFF Android rather than a reason to ship it there:
 * that code CANCELS tracker-cookie purging when sanitizeOnShutdown is true and
 * privacy.clearOnShutdown.history or .siteSettings is true. Those two are
 * declared only in browser/app/profile/firefox.js:1233,1240, so today they read
 * false on Android and the cancel does not fire -- but shipping
 * sanitizeOnShutdown=true there would buy nothing (no Sanitizer) while arming
 * that trap for the day something sets them. (CookieService.cpp:66-92 only
 * *writes* these prefs, inside the network.cookie.lifetimePolicy migration.)
 */
// Sanitize on Shutdown, see: https://support.mozilla.org/en-US/questions/1275887
defaultPref("privacy.sanitize.sanitizeOnShutdown", true);
defaultPref("privacy.sanitize.timeSpan", 0);
defaultPref("privacy.clearOnShutdown_v2.historyFormDataAndDownloads", false);
defaultPref("privacy.clearOnShutdown_v2.browsingHistoryAndDownloads", false);
// The sanitation settings have actually changed..
defaultPref("privacy.sanitize.clearOnShutdown.hasMigratedToNewPrefs3", true);

