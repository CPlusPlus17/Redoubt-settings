/** ------------------------------
 * [CATEGORY] LIBREWOLF
 * prefs introduced by librewolf-specific patches whose patch file is in
 * assets/patches/desktop.txt, so the code that reads them is never in an
 * Android tree.
 * ------------------------------- */
// themes/browser/base/content/aboutDialog.js:44 -- the desktop About dialog,
// copied into browser/ by scripts/librewolf-patches.py:334.
defaultPref("librewolf.aboutMenu.checkVersion", false);
// Added via patches/moz-official.patch -- now patches/moz-official-desktop.patch
// (desktop.txt). Its three hunks are all browser/base; the common half of that
// straddler does not use this pref. moz-official-desktop.patch's own header
// records that no Android counterpart is needed.
defaultPref("librewolf.devHelpers", false);

// Toggle for enabling/disabling fetching of the CDN wallpapers
// (patches/ui-patches/wallpapers.patch, desktop.txt)
defaultPref("librewolf.externalWallpapers.enabled", false);

// Used for determining if the Mullvad DNS migration should be shown
// (patches/mullvad-dns-migration.patch, desktop.txt)
defaultPref("librewolf.migration.show_doh_notification", false);

/** ------------------------------
 * [CATEGORY] OVERRIDES
 * allow settings to be overriden with a file placed in the right location
 * https://librewolf.net/docs/settings/#where-do-i-find-my-librewolfoverridescfg
 * Moved to patches/profile-directory.patch
 *
 * (That patch is in common.txt, but the paths it builds come from
 * XDG_CONFIG_HOME / HOME / USERPROFILE and it runs from prefcalls.js, which
 * Android never executes. An Android override channel, if we want one, is a
 * separate design -- it is not this.)
 * ------------------------------- */
