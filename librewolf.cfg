 *
 * The window-sizing trio (privacy.window.maxInner{Width,Height} +
 * browser.toolbars.bookmarks.visibility) and the letterboxing pref live in
 * desktop.cfg; RFP itself is core and stays here.
 */
defaultPref("privacy.resistFingerprinting", true);
// rfp related settings
