/** [SECTION] RFP -- window sizing and letterboxing
 *
 * increase the size of new RFP windows for better usability, while still using a rounded value.
 * if the screen resolution is lower it will stretch to the biggest possible rounded value.
 * also, expose hidden letterboxing pref but do not enable it for now.
 *
 * WHY DESKTOP, precisely -- the board's shorthand ("no windows to size on
 * Android") is the right call for the wrong mechanism, so here is the real one:
 *
 *   privacy.window.maxInner{Width,Height} are StaticPrefs read in core DOM,
 *   dom/base/nsContentUtils.cpp:3036-3047, not in desktop code. They are the
 *   ceiling in `std::min(maxInnerWidth, screenWidth - chromeWidth)` inside
 *   CalcRoundedWindowSizeForResistingFingerprinting. Its two callers are
 *   xpfe/appshell/AppWindow.cpp:1070 (XUL windows -- GeckoView creates none)
 *   and toolkit/components/windowwatcher/nsWindowWatcher.cpp:2446, which fires
 *   only for window.open() with an explicit size. On a phone the available
 *   width is far below the ceiling, so the min() always picks the screen and
 *   the pref never binds.
 *
 *   Note also that LibreWolf *raises* the width ceiling (Gecko's default is
 *   1400x900, StaticPrefList.yaml:17850) as a usability tweak. Not shipping it
 *   on Android leaves the tighter Mozilla value in place, so this is not a
 *   protection being dropped.
 *
 *   browser.toolbars.bookmarks.visibility is here for the same reason: it is
 *   set to "always" so the desktop chrome height is constant and the rounding
 *   above lands exactly (LibreWolf #1569). Its only non-browser/ reader is
 *   xpfe/appshell/AppWindow.cpp:1786, which needs a chrome document with a
 *   toolbar-menubar element.
 *
 *   privacy.resistFingerprinting.letterboxing is shipped FALSE and is here only
 *   so it stays visible in about:config next to the prefs it relates to.
 *   RFPHelper.sys.mjs drives letterboxing entirely through chrome DOM
 *   (browserParent.classList, chrome://global/content/resistfingerprinting/
 *   letterboxing.css), which GeckoView does not have.
 *   *** THIS IS NOT A PARITY ITEM. Desktop LibreWolf ships letterboxing off, so
 *   *** Android not having it costs our users nothing. Do NOT record it as an
 *   *** Android gap; earlier drafts of the plan did and it was wrong.
 */
defaultPref("privacy.window.maxInnerWidth", 1600);
defaultPref("privacy.window.maxInnerHeight", 900);
defaultPref("privacy.resistFingerprinting.letterboxing", false);
// this ensures there is no rounding error when computing the window size, see #1569.
defaultPref("browser.toolbars.bookmarks.visibility", "always");

