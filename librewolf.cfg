null;

/** LIBREWOLF SETTINGS -- common.cfg
 *  (also the head of the GENERATED librewolf.cfg; see the split note below)
 *
 * take the time to read and understand, but also to customize the settings to find your own setup.
 * the answers to the most common questions can be found at https://librewolf.net/docs/faq/.
 *
 * WARNING: make sure the first line of this file is empty. this is a known bug.
 *
 * ---------------------------------------------------------------------------
 * THIS FILE IS ONE THIRD OF A THREE-WAY SPLIT (LW-M3-01)
 * ---------------------------------------------------------------------------
 *
 *   common.cfg   this file -- prefs that apply to every target
 *   desktop.cfg  prefs whose consumer does not exist on Android
 *   android.cfg  prefs that only make sense on Android
 *
 *   librewolf.cfg  == common.cfg + desktop.cfg, concatenated in that order.
 *                     GENERATED. Do not edit it; edit these files instead.
 *
 * librewolf.cfg is the two files joined with no separator and nothing added, so
 * `--check-cfg-split` can verify it byte for byte.
 *
 * `null;` above is the sacrificial first line: nsJSConfigTriggers.cpp's
 * EvaluateAdminConfigScript is called with skipFirstLine=true for the primary
 * .cfg, so line 1 is never parsed. common.cfg MUST therefore stay first in
 * every concatenation, and desktop.cfg / android.cfg must never be fed to
 * autoconfig on their own -- their first line would be eaten.
 *
 * No pref name appears twice anywhere in the three files, so concatenation
 * order does not change any effective value.
 *
 * ---------------------------------------------------------------------------
 * READING THIS FILE ON ANDROID -- landmine L2, and one more
 * ---------------------------------------------------------------------------
 *
 * Android has no autoconfig: nsReadConfig resolves general.config.filename
 * relative to NS_GRE_DIR, which nsXREDirProvider.cpp leaves empty there. So
 * nothing in this file *runs* on Android. LW-M3-02 compiles it into the two
 * channels that do work, and both of them are lossy in ways that matter:
 *
 * 1. MOZ_DEFAULT_PREFS (GeckoLoader.java:83-103 -> Preferences.cpp:3963) is
 *    parsed by parsePrefData(..., PrefValueKind::Default). The libpref grammar
 *    it accepts is `pref` / `user_pref` / `sticky_pref` only
 *    (modules/libpref/parser/src/lib.rs:14, 297-321). There is no
 *    `locked_pref`. **MOZ_DEFAULT_PREFS cannot lock.** Every lockPref below
 *    therefore needs a real Preferences::Lock call wired up by LW-M3-03; do
 *    not assume the lock survives the compile.
 *
 * 2. Fenix's runtime Pref.commit() runs AFTER the profile loads and overwrites
 *    any UNLOCKED pref it owns. The 22 prefs below that GeckoRuntimeSettings.java
 *    or ContentBlocking.java declare are marked `[ANDROID: LOCK]`. That marker
 *    is a hint for LW-M3-04, which generates the authoritative list by globbing
 *    those two Java files -- it is not a substitute for it, and it is not
 *    maintained by hand.
 *
 * 3. Bare `pref()` in autoconfig is NOT defaultPref. prefcalls.js:12-34 uses
 *    getPrefBranch() == Services.prefs.getBranch(null), i.e. the USER branch,
 *    re-applied at every startup. The same text inside MOZ_DEFAULT_PREFS lands
 *    on the DEFAULT branch instead, which is weaker: a stale user value in the
 *    profile then wins. The 24 bare pref() calls in this file are the ones the
 *    upstream comments say "must be set with pref() otherwise it won't stick";
 *    on Android they need the user branch (Pref.commit) or a lock, not
 *    MOZ_DEFAULT_PREFS. LW-M3-02 must not silently downgrade them.
 */

lockPref("librewolf.cfg.version", "8.6");

/** INDEX
 *
 * The file is organized in categories, and each one has a number of sections:
 *
 *
 * - PRIVACY [ISOLATION, SANITIZING, CACHE AND STORAGE, HISTORY AND SESSION RESTORE, QUERY STRIPPING]

 * - NETWORKING [HTTPS, REFERERS, WEBRTC, PROXY, DNS, DOH, PREFETCHING AND SPECULATIVE CONNECTIONS]
 *
 * - FINGERPRINTING [RFP, WEBGL]
 *
 * - SECURITY [SITE ISOLATION, CERTIFICATES, TLS/SSL, PERMISSIONS, SAFE BROWSING, OTHERS]
 *
 * - REGION [LOCATION, LANGUAGE]
 *
 * - BEHAVIOR [DRM, SEARCH AND URLBAR, DOWNLOADS, AUTOPLAY, POP-UPS AND WINDOWS, MOUSE, MACHINE LEARNING]
 *
 * - EXTENSIONS [USER INSTALLED, SYSTEM, EXTENSION FIREWALL]
 *
 * - BUILT-IN FEATURES [UPDATER, SYNC, LOCKWISE, CONTAINERS, DEVTOOLS, SHOPPING, OTHERS]
 *
 * - UI [BRANDING, HANDLERS, FIRST LAUNCH, NEW TAB PAGE, ABOUT, ASROUTER, RECOMMENDED, OTHERS]
 *
 * - TELEMETRY
 *
 * - WINDOWS [UPDATES, OTHERS]   <- moved wholesale to desktop.cfg
 *
 * - MACOS                        <- desktop.cfg only
 *
 * - LIBREWOLF []
 *
 */

/** ------------------------------
 * [CATEGORY] PRIVACY
 * ------------------------------- */

/** [SECTION] ISOLATION
 * default to strict mode, which includes:
 * 1. dFPI for both normal and private windows
 * 2. strict blocking lists for trackers
 * 3. shims to avoid breakage caused by blocking lists
 * 4. stricter policies for xorigin referrers
 * 5. dFPI specific cookie cleaning mechanism
 * 6. query stripping
 *
 * the desired category must be set with pref() otherwise it won't stick.
 * the UI that allows to change mode manually is hidden.
 */
pref("browser.contentblocking.category", "strict"); // [ANDROID: LOCK] ContentBlocking.java
defaultPref("privacy.trackingprotection.allow_list.baseline.enabled", true); // [ANDROID: LOCK] ContentBlocking.java
defaultPref("privacy.trackingprotection.allow_list.convenience.enabled", false); // [ANDROID: LOCK] ContentBlocking.java
lockPref("privacy.trackingprotection.allow_list.hasMigratedCategoryPrefs", true); // https://codeberg.org/librewolf/settings/pulls/139#issuecomment-19660777

defaultPref("network.cookie.cookieBehavior.optInPartitioning", true); // [ANDROID: LOCK] GeckoRuntimeSettings.java
defaultPref("network.cookie.cookieBehavior.optInPartitioning.pbmode", true); // [ANDROID: LOCK] GeckoRuntimeSettings.java

/** [SECTION] SANITIZING
