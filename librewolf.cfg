 * toolkit/moz.build:31-35 builds only for OS_ARCH == WINNT and reads at
 * toolkit/xre/nsAppRunner.cpp:284; browser.startup.windowsLaunchOnLogin.defaultEnabled
 * is browser/components/defaultwindowslaunchonlogin; and the clearPref undoes a
 * Windows-only registry pref (toolkit/xre/nsAppRunner.h). None of the four has
 * any meaning on Android.
 * ------------------------------- */

