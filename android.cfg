/** LIBREWOLF SETTINGS -- ANDROID
 *
 * ---------------------------------------------------------------------------
 * THIS IS A FRAGMENT, NOT A STANDALONE .cfg
 * ---------------------------------------------------------------------------
 *
 * It is never concatenated into librewolf.cfg (which is common.cfg +
 * desktop.cfg, and is what the desktop build ships). Like desktop.cfg it has no
 * sacrificial first line -- common.cfg's `null;`, which autoconfig's
 * skipFirstLine eats -- so it must never be handed to autoconfig on its own.
 *
 * DELIVERY, corrected by LW-M3-09 after measuring it. An earlier version of this
 * header said "LW-M3-02's compiler (scripts/cfg2prefs.py) reads common.cfg +
 * android.cfg and emits the two Android pref-delivery artifacts". There is no
 * such script, and that is not how it ended up working. What LW-M3-02 actually
 * landed is patches/android/autoconfig-resource-fallback.patch: Android reads
 * the SAME .cfg the desktop autoconfig channel reads, out of omni.ja via
 * resource://gre/defaults/autoconfig/librewolf.cfg. So the Android composition
 * is simply `common.cfg + android.cfg` concatenated, in that order, written to
 * lw/librewolf.cfg -- and the ORDER is the mechanism: android.cfg's calls run
 * after common.cfg's and therefore override them.
 *
 * The build does that composition (LW-M3-10): for an android target,
 * scripts/librewolf-patches.py writes `cat common.cfg android.cfg` to
 * lw/librewolf.cfg, which is packaged into omni.ja. EVERY CALL IN THIS FILE
 * SHIPS IN THE APK AND RUNS ON THE DEVICE. (Until LW-M3-10 the patcher copied
 * settings/librewolf.cfg = common + desktop on every target, and this header
 * said that nothing in this file reached a device. That stopped being true
 * when LW-M3-10 landed; the sentence outlived it.)
 *
 * ---------------------------------------------------------------------------
 * DELIBERATELY EMPTY OF PREFS, and that is the honest result of LW-M3-01
 * ---------------------------------------------------------------------------
 *
 * The three-way split of librewolf.cfg produced 182 common prefs and 85 desktop
 * prefs and no Android-only pref. That is expected: librewolf.cfg is a
 * desktop-derived file, so the split can only ever *subtract* from it. Anything
 * Android-only has to be added by a task that has a reason to add it, and two
 * already exist:
 *
 *   LW-M3-06  maps settings/distribution/policies.json onto Android and appends
 *             the prefs that cover a policy here. It co-owns this file.
 *   LW-M5-01  locks fission.webContentIsolationStrategy. Whether that lands
 *             here or in the Kotlin layer is that task's call.
 *
 * Two things that look like they belong here and do not:
 *
 *   librewolf.webgl.prompt -- landmine L1. Already handled, and correctly, by
 *   patches/android/webgl-prompt-default.patch (assets/patches/android.txt),
 *   which flips the compiled-in default. Do not restate it as a pref here; two
 *   sources for one value is how they drift.
 *
 *   The ~50-pref must-lock list -- that is LW-M3-04, generated mechanically
 *   from GeckoRuntimeSettings.java and ContentBlocking.java. common.cfg carries
 *   `[ANDROID: LOCK]` markers on the 22 prefs we ship that those two files
 *   declare today; they are a cross-reference for LW-M3-04, not the list.
 *
 * ---------------------------------------------------------------------------
 * TWO DELIVERY FACTS LW-M3-02 AND LW-M3-03 MUST NOT ASSUME AWAY
 * ---------------------------------------------------------------------------
 *
 * 1. MOZ_DEFAULT_PREFS as GeckoLoader emits it carries no lock -- but NOT for the
 *    reason this comment used to give. It said "there is no `locked_pref` token
 *    (lib.rs:14, 297-321)". That was wrong and it was load-bearing for three
 *    rounds, because it kept being passed forward as established.
 *
 *    `locked` is a pref ATTRIBUTE, not a token, declared six lines above the
 *    region that was grepped: lib.rs:30 `<pref-attr> = "sticky" | "locked"`
 *    (default pref files only). Token::Locked is at :176, consumed at :508 inside
 *    the PrefValueKind::Default branch -- exactly the mode Preferences.cpp:3963
 *    parses MOZ_DEFAULT_PREFS in. Upstream uses it: all.js:1773, :3978, :3986 are
 *    all `pref("...", false, locked);`.
 *
 *    What is true is narrower: GeckoLoader.java:91-100 builds `pref("key",value);`
 *    and never appends an attribute. The channel cannot lock because nothing
 *    writes the attribute, not because the syntax is missing.
 *
 *    AND THAT INVERTS A HAZARD. A locked default from the env var runs BEFORE
 *    autoconfig, and Pref::SetDefaultValue returns without writing when IsLocked()
 *    (Preferences.cpp:885) -- so it would make this file's later defaultPref calls
 *    SILENT NO-OPS. common.cfg is overwhelmingly defaultPref. Only lockPref would
 *    still win, because prefcalls.js:64-77 calls unlockPref() first. Anyone who
 *    "improves" the env channel by teaching GeckoLoader to emit `locked` would
 *    silently disable most of LibreWolf's configuration.
 *
 *    The 38 lockPref calls in common.cfg are fine as they are: autoconfig's
 *    lockPref calls Preferences::Lock directly, verified on a running build.
 *
 * 2. MOZ_DEFAULT_PREFS writes the DEFAULT branch, but autoconfig's bare
 *    `pref()` writes the USER branch (prefcalls.js:12-34, getPrefBranch() ==
 *    Services.prefs.getBranch(null)) and does so at every startup. The 24 bare
 *    pref() calls in common.cfg are exactly the ones whose comments say the
 *    value "won't stick" as a default. Compiling them into MOZ_DEFAULT_PREFS is
 *    a silent downgrade: a stale user value in the profile then wins.
 *
 * ---------------------------------------------------------------------------
 * GAP REGISTER
 * ---------------------------------------------------------------------------
 *
 * Prefs that went to desktop.cfg because the *implementation* is desktop-only,
 * while the *behaviour* is still something LibreWolf for Android should have.
 * Each needs a non-pref answer. These feed the M5 parity matrix; do not treat
 * an entry here as closed just because the pref moved.
 *
 *   G1  Sanitize on shutdown
 *       desktop.cfg: privacy.sanitize.* + privacy.clearOnShutdown_v2.*
 *       Sanitizer.sys.mjs is browser/modules/. Fenix has "Delete browsing data
 *       on quit" in Kotlin, keyed off its own SharedPreferences. Owner: M4/M5.
 *
 *   G2  Account and sync
 *       desktop.cfg: identity.fxaccounts.enabled
 *       services/fxaccounts is not built on Android and MOZ_SERVICES_SYNC is
 *       browser-only. Fenix's stack is Kotlin over application-services. Owner: M4.
 *
 *   G3  First-run and messaging surfaces
 *       desktop.cfg: startup.homepage_welcome_url*, browser.uitour.*,
 *       startup.homepage_override_nimbus_disable_wnp, the four
 *       activity-stream.asrouter.providers.* locks
 *       Fenix onboarding + Nimbus Messaging are Kotlin. Owner: M4.
 *
 *   G4  Home-screen telemetry and sponsored content
 *       desktop.cfg: browser.newtabpage.activity-stream.*, browser.topsites.*
 *       Fenix home screen, Contile sponsored tiles, Pocket -- all Kotlin. Owner: M4.
 *
 *   G5  Web-compat reporter
 *       desktop.cfg: extensions.webcompat-reporter.*
 *       Android ships android-components feature/webcompat-reporter, a
 *       different extension installed from Kotlin. Owner: M4.
 *
 *   G6  Search-suggestion and urlbar surfaces
 *       desktop.cfg: browser.urlbar.*
 *       browser.search.suggest.enabled (common.cfg) covers the network side.
 *       The Fenix awesomebar's own suggestion providers, and its speculative
 *       connections (Engine.speculativeConnect, which no pref gates), do not.
 *       Owner: M4.
 *
 * NOT A GAP, and it must stay off this list:
 *
 *   privacy.resistFingerprinting.letterboxing. Desktop LibreWolf ships it
 *   FALSE (see desktop.cfg and docs/android/ROADMAP.md). Android not having
 *   letterboxing costs our users nothing. Earlier drafts of the plan listed it
 *   as a parity item; that was wrong.
 */

/* ---------------------------------------------------------------------------
 * ANDROID-ONLY PREFS
 * LW-M3-06 appends below this line. Keep the file parseable when it is empty.
 * --------------------------------------------------------------------------- */

/* ---------------------------------------------------------------------------
 * FROM settings/distribution/policies.json  (LW-M3-06)
 * ---------------------------------------------------------------------------
 *
 * The enterprise policy engine does not exist on Android, and it is gated
 * twice: toolkit/components/enterprisepolicies/moz.build:16 puts both the
 * EXTRA_JS_MODULES and XPCOM_MANIFESTS += ["components.conf"] inside
 * `if CONFIG["MOZ_WIDGET_TOOLKIT"] != "android"`, and every policy body lives
 * in browser/components/enterprisepolicies/Policies.sys.mjs, which Android
 * never builds. components.conf is what declares js_name 'policies', so
 * `Services.policies` is UNDEFINED on Android -- not merely inactive. Toolkit
 * code that runs on both already guards for exactly that (ResetProfile.sys.mjs:56,
 * UpdateUtils.sys.mjs:498, ServiceRequest.sys.mjs:88).
 *
 * All 22 policy keys are mapped in docs/android/POLICIES.md. Only TWO of them
 * reduce to a pref that is (a) absent from common.cfg and desktop.cfg, (b) read
 * by code that ships on Android, and (c) not already at the policy's value by
 * default. Those two are below.
 *
 * The other 20 are deliberately NOT here. Twelve need Kotlin-layer work and are
 * registered as gaps P1..P7 in POLICIES.md; the remaining eight are moot on
 * Android (no updater, no default-browser agent, no browser/ chrome, or the
 * Android default already equals the policy value). Restating a
 * desktop-only pref here would parse fine, change nothing, and show up green in
 * scripts/android-pref-audit.sh -- which is exactly the hole this task exists
 * to avoid.
 *
 * BRANCH AND LOCK. Both prefs below are `defaultPref`, i.e. DEFAULT branch,
 * UNLOCKED. That is not a compromise forced by the delivery channel -- it is
 * what the desktop policy does. PoliciesUtils.setDefaultPref
 * (Policies.sys.mjs:3449-3495) writes Services.prefs.getDefaultBranch("") and
 * locks only when its third argument is truthy; both of these policies pass
 * `param.Locked`, and neither policies.json entry has a Locked key. A lockPref
 * here would be STRICTER than desktop, not equal to it.
 *
 * Consequently neither pref depends on LW-M3-08. MOZ_DEFAULT_PREFS writes the
 * default branch, so it carries both correctly today; native autoconfig would
 * carry them identically. Neither appears in GeckoRuntimeSettings.java,
 * ContentBlocking.java, or the Nimbus gecko-pref map in
 * mobile/android/fenix/app/nimbus.fml.yaml, so no runtime writer overwrites
 * them and no lock is needed to make them stick.
 *
 * Note for LW-M3-04: that Nimbus map is a THIRD pref writer, beyond the two in
 * landmine L2 -- NimbusGeckoPrefHandler.kt:54,283 applies remotely-fetched
 * values via setGeckoPrefsState(). It is registered as P8 in POLICIES.md.
 */

/** EncryptedMediaExtensions: {"Enabled": false}
 *
 * The only policy row where Android's own default actively disagrees with
 * LibreWolf. firefox-157.0's StaticPrefList.yaml:12408-12421 guards the value with
 * `#if defined(XP_LINUX) && !defined(MOZ_WIDGET_ANDROID)` -- Android takes the
 * #else and gets TRUE. Desktop LibreWolf ships EME off via this policy alone;
 * media.eme.enabled is in neither common.cfg nor desktop.cfg. Without the line
 * below, LibreWolf for Android would ship DRM enabled while the desktop build
 * ships it disabled.
 *
 * Android's media.eme.require-app-approval (geckoview-prefs.js:287, honoured at
 * MediaKeySystemAccessManager.cpp:259) adds a per-site embedder prompt on top,
 * but a prompt is not the blanket disable the policy expresses.
 */
defaultPref("media.eme.enabled", false);

/** LocalNetworkAccess: {"Enabled": true, "BlockTrackers": true, "EnablePrompting": true}
 *
 * Two of the three sub-keys already match the Android default:
 *   network.lna.enabled   policy true  == StaticPrefList.yaml:15760-15763 true
 *   network.lna.blocking  policy true  == StaticPrefList.yaml:15766-15769 true  (EnablePrompting)
 *   network.lna.block_trackers  policy true  != StaticPrefList.yaml:15773-15776 FALSE
 * (line numbers in firefox-157.0's modules/libpref/init/StaticPrefList.yaml)
 *
 * so only block_trackers needs stating. common.cfg's [SECTION] Local Network
 * Access (:275-279) ships two neighbouring network.lna.* prefs and a
 * commented-out third, but not this one -- desktop gets it from the policy.
 *
 * The prompting half is functional on Android: GeckoSession.java:7213 defines
 * PERMISSION_LOCAL_NETWORK_ACCESS ("local-network" at :7365,:7394) and
 * android-components persists it (SitePermissions.kt:31,97).
 *
 * [ANDROID: LOCK] GeckoRuntimeSettings.java:779 (firefox-157.0)
 * CORRECTION (skeptical verification of LW-M3-06): an earlier version of this
 * comment and of docs/android/POLICIES.md asserted this pref is "not present in
 * GeckoRuntimeSettings.java ... so no writer overwrites it and no lock is
 * needed". That is FALSE. It is declared at GeckoRuntimeSettings.java:789 as
 * `new PrefWithoutDefault<>("network.lna.block_trackers")`, which makes it
 * exactly the landmine-L2 case: GeckoView owns it at runtime, so an unlocked
 * defaultPref here is transient. It needs a real lock, and per LW-M3-01 the
 * MOZ_DEFAULT_PREFS channel cannot express one -- so the value below is
 * ADVISORY until LW-M3-08 settles whether autoconfig (and therefore lockPref)
 * works on Android. LW-M3-04 must pick this pref up from the generated list.
 */
// [ANDROID: LOCK] GeckoRuntimeSettings.java:779 (157) -- a REAL lock, not a marker.
// Stage 5b overwrites this on every cold start with no user interaction
// (this chain was traced on 153 ESR and its line numbers are 153's; on 157 the
// setter is GeckoEngine.kt:1916 and GeckoRuntimeSettings.java:2162):
// Core.kt:224 -> GeckoEngine.kt:2061 -> setLnaBlockTrackers ->
// GeckoRuntimeSettings.java:2134 -> mLnaBlockTrackers.commit(false). The equality
// guard at RuntimeSettings.java:106 cannot short-circuit because PrefWithoutDefault
// is constructed with super(name, null) (:186-187), so Fenix's own default commits
// over ours. Nimbus lnaBlocking.block-trackers defaults false. The only UI is a
// hidden debug switch, so locking costs no user-visible control.
lockPref("network.lna.block_trackers", true);

/** network.lna.allow_top_level_navigation -- formerly common.cfg LNA
 *
 * Upstream commented it out (common.cfg:278; OAuth flows that navigate to a
 * local address broke, librewolf.dev/librewolf/issues/issues/3155).
 * firefox-157.0's StaticPrefList.yaml:15780-15783 defaults it to TRUE, so
 * dropping the line lets top-level navigations to local-network addresses
 * bypass LNA on Android. Android shipped false through the 153 ESR betas.
 *
 * Dropped from this file on 2026-10-02 when Android moved to Firefox 157, and
 * restored the same day by owner decision: Android keeps LNA on top-level
 * navigations. Desktop follows upstream. GeckoView does not declare this pref
 * (GeckoRuntimeSettings.java:777-781 declares only network.lna.blocking,
 * .block_trackers and .enabled), so no runtime writer overwrites it and an
 * unlocked defaultPref sticks.
 */
defaultPref("network.lna.allow_top_level_navigation", false);

/* ---------------------------------------------------------------------------
 * FROM settings/common.cfg's BARE pref() CALLS  (LW-M3-09, landmine L2b)
 * ---------------------------------------------------------------------------
 *
 * A bare `pref()` in a .cfg writes the USER branch
 * (extensions/pref/autoconfig/src/prefcalls.js:12-18 routes it through
 * Services.prefs.getBranch(null)), and on Android
 * `GeckoView:ResetUserPrefs` runs AFTER autoconfig and clears the user branch:
 * GeckoViewStartup.sys.mjs:394-398 loops `Services.prefs.clearUserPref(name)`
 * over a name list built by RuntimeSettings.java:353-367 from `forAllPrefs`.
 *
 * So the question for each of common.cfg's 24 bare pref() calls is exactly one
 * question: IS THE NAME IN THAT LIST? The list is the prefs declared by the
 * three RuntimeSettings subclasses -- GeckoRuntimeSettings (GeckoRuntimeSettings.java:34),
 * ContentBlocking.Settings (ContentBlocking.java:104) and SafeBrowsingProvider
 * (ContentBlocking.java:1571) -- minus those that neither hasDefault() nor
 * isSet(). 101 names are declared with literal strings; SafeBrowsingProvider
 * builds 12 more per provider from `ROOT + mName + "..."` (:1815-1826) for
 * google, google4 and google5, which is 36 names no literal-string grep sees.
 *
 * FOUR of the 24 are in that list. The other TWENTY are not, so their user
 * value survives on Android exactly as it does on desktop and they are
 * deliberately NOT restated here -- promoting them would be a REGRESSION, not a
 * fix: a bare pref() re-asserts the value at every startup and overrides a
 * stale profile value, and a defaultPref would let that stale value win. The
 * per-pref table and the measurements are in docs/android/parity/bare-prefs.md.
 *
 * common.cfg is UNCHANGED by this task, byte for byte. Desktop keeps the bare
 * pref() semantics it needs -- for the category pref, common.cfg:114 says so in
 * as many words ("the desired category must be set with pref() otherwise it
 * won't stick") -- and settings/librewolf.cfg therefore does not move either.
 *
 * MEASURED BOTH WAYS, on two APKs built from the same tree that differ only in
 * lw/librewolf.cfg. BEFORE (common+desktop, the composition Android ships
 * today): 21 of the 24 read LibreWolf's value, 3 did not. AFTER
 * (common+android, hand-composed): 24 of 24 do, with
 * browser.contentblocking.category = "strict" and
 * devtools.debugger.remote-enabled = false both reported LOCKED by the pref
 * dump. Run provenance, the APK omni.ja hash and the full table are in
 * docs/android/parity/bare-prefs.md.
 *
 * The four lines below are CORRECT AND STILL INERT in the shipped build:
 * scripts/librewolf-patches.py copies settings/librewolf.cfg (= common+desktop)
 * on every target, so nothing in this file reaches a device until LW-M3-10
 * lands the per-target composition. The measurement above was taken on a tree
 * where that composition was done by hand.
 *
 * WHY defaultPref FOR SOME AND lockPref FOR OTHERS. ResetUserPrefs only clears
 * the user branch, so defaultPref is enough to beat it. lockPref is needed only
 * where a SECOND writer exists: `Pref.commit()` (RuntimeSettings.java:113-122)
 * dispatches GeckoView:SetDefaultPrefs at RUNTIME, which rewrites the default
 * branch and beats an unlocked defaultPref (landmine L2). A lock is not free --
 * it makes the Fenix control that writes the pref inert -- so it is used only
 * where a runtime writer was actually found, and each one is named below for
 * LW-M3-04's must-not-lock review.
 *
 * WHY A LOCK ACTUALLY WINS, in libpref rather than by observation.
 * GeckoViewStartup.sys.mjs:400-420 handles SetDefaultPrefs by writing
 * Services.prefs.getDefaultBranch(""), which lands in Pref::SetDefaultValue
 * (modules/libpref/Preferences.cpp:876-902). Its first act is
 *
 *     // Should we set the default value? Only if the pref is not locked [...]
 *     if (!IsLocked()) { ... }
 *
 * -- a locked pref's DEFAULT value cannot be changed, and the write returns
 * NS_OK, so nothing throws and Fenix sees no error. That is the mechanism
 * behind LW-M3-08's observation that a lockPref'd devtools.debugger.remote-enabled
 * stayed false after the Fenix switch was turned ON; it is also why locking is
 * safe (a commit() on a locked pref is a silent no-op, not an exception).
 */

/** browser.contentblocking.category -- common.cfg:117, bare pref("strict")
 *
 * THE MEASURED CASUALTY. about:config on Android read "standard": GeckoView
 * commits its own Java default (ContentBlocking.java:579, "standard") to the
 * DEFAULT branch, our "strict" went to the user branch, and ResetUserPrefs
 * removed it. Android was shipping Fenix's tracking-protection category while
 * the config said strict, and no build error showed it.
 *
 * This is NOT a cosmetic desktop-UI aggregate on Android. It is read by code
 * that ships here: netwerk/url-classifier/UrlClassifierExceptionListEntry.cpp:99-112
 * skips a Remote Settings tracking-protection EXCEPTION entry unless its
 * `filterContentBlockingCategories` list contains this string -- so "standard"
 * activates the standard-category exceptions, i.e. allow-lists trackers that
 * "strict" would keep blocked. Also read at
 * toolkit/components/url-classifier/RealTimeRequestSimulator.cpp:26.
 *
 * lockPref, not defaultPref: there is a runtime writer.
 * ContentBlocking.java:1062-1073 setEnhancedTrackingProtectionCategory calls
 * mEtpCategory.commit(...), reached from GeckoEngine.kt:1511 in the
 * trackingProtectionPolicy setter, which Fenix drives from
 * TrackingProtectionFragment.kt. commit() early-returns only while the Java
 * value is unchanged, so an unlocked defaultPref survives exactly until the
 * user touches the ETP screen.
 *
 * COST, and it is a real one: Fenix's Settings > Enhanced Tracking Protection
 * category selector becomes inert -- it will still move, and the behaviour will
 * not. That is what desktop does too (LibreWolf hides the equivalent UI and
 * rewrites the pref at every startup), so this is parity, not a new decision --
 * but it belongs in LW-M3-04's "locked, known to leave a visible control dead"
 * list, not in the must-not-lock allowlist.
 */
lockPref("browser.contentblocking.category", "strict");

/** devtools.debugger.remote-enabled -- common.cfg:561, bare pref(false)
 *
 * Reads false on Android today, and only by coincidence: GeckoView's own Java
 * default is false too (GeckoRuntimeSettings.java:748). Our user-branch value
 * is wiped just the same, so the correct value is being supplied by Fenix, not
 * by us -- it would flip silently if that default ever changed.
 *
 * lockPref, not defaultPref: SettingsFragment.kt:603 assigns
 * engine.settings.remoteDebuggingEnabled at RUNTIME from the "Remote debugging
 * via USB" switch, which is mRemoteDebugging.commit(...). LW-M3-08 measured
 * this exact pair on a running build: lockPref'd, it stayed false after the
 * switch was turned ON, while an unlocked control pref flipped in the same
 * session and process. That is the observation landmine L2 is built on.
 *
 * COST: the "Remote debugging via USB" switch becomes inert. Desktop LibreWolf
 * ships remote debugging off, so this is parity. For LW-M3-04's dead-control
 * list.
 */
lockPref("devtools.debugger.remote-enabled", false);

/** devtools.console.stdout.chrome -- common.cfg:166, bare pref(false)
 *
 * Read TRUE on Android before this line existed, and FALSE with it -- both
 * measured, see docs/android/parity/bare-prefs.md.
 *
 * The field is mDevToolsConsoleToLogcat (GeckoRuntimeSettings.java:766-767),
 * `new Pref<>("devtools.console.stdout.chrome", true)`. ResetUserPrefs removed
 * our user-branch false and left GeckoView's Java default of true, so chrome
 * console output went to logcat on Android while LibreWolf disables it
 * everywhere else -- see the common.cfg:161-164 rationale (these are off in
 * official Mozilla builds).
 *
 * CORRECTION (LW-M3-09, second pass). An earlier version of this comment
 * attributed the pref to mConsoleOutput and to Builder.consoleOutput()
 * (GeckoRuntimeSettings.java:224-225, GeckoProvider.kt:121). That is the WRONG
 * FIELD: mConsoleOutput is `geckoview.console.enabled`
 * (GeckoRuntimeSettings.java:751-752), a different pref that we do not ship,
 * and setConsoleOutputEnabled(:1589) commits THAT one. The conclusion below is
 * unchanged, but it now rests on the right code.
 *
 * defaultPref is enough, and lockPref would be over-locking. There is NO
 * runtime writer for THIS pref: mDevToolsConsoleToLogcat is assigned in exactly
 * one place, Builder.debugLogging() (GeckoRuntimeSettings.java:517-521), and
 * that is `set()`, not `commit()` -- so its value arrives before the profile via
 * getPrefsMap/MOZ_DEFAULT_PREFS and autoconfig runs after it. There is no
 * setter on GeckoRuntimeSettings itself that commits it. GeckoProvider.kt:122
 * calls debugLogging(Config.channel.isDebug || settings.enableGeckoLogs) -- note
 * that on a DEBUG build (which every smoke APK is) that argument is
 * unconditionally true, which is why the miss was visible at all -- and flipping
 * the secret-menu toggle (SettingsFragment.kt:718-740) only writes a
 * SharedPreference and calls exitProcess(0), so the value is re-derived through
 * the Builder on the next launch. Leaving it unlocked also keeps the rest of
 * that debug toggle (geckoview.logging, consoleservice.logcat) working.
 * [ANDROID: LOCK] GeckoRuntimeSettings.java:767
 */
defaultPref("devtools.console.stdout.chrome", false);

/** browser.safebrowsing.provider.google4.dataSharingURL -- common.cfg:384, bare pref("")
 *
 * Read
 * https://safebrowsing.googleapis.com/v4/threatHits?$ct=application/x-protobuf&key=%GOOGLE_SAFEBROWSING_API_KEY%&$httpMethod=POST
 * on Android before this line existed, and "" with it -- both measured.
 * `browser.safebrowsing.provider.google4.dataSharing.enabled` is false so
 * nothing was being sent, but blanking the URL is the defence in depth the
 * common.cfg comment asks for, and it was not in place.
 *
 * This name is NOT one of the 101 literal declarations. SafeBrowsingProvider
 * builds it as ROOT + mName + ".dataSharingURL" (ContentBlocking.java:1572,
 * :1824) for each of the three providers named at :29,:51,:77 -- 12 suffixes x
 * 3 providers = 36 names that no name-literal grep sees, including board.py's
 * _gv_declared_prefs and therefore its BARE_PREF_BACKLOG ratchet.
 *
 * Why it is in the reset list: NOT because a provider "supplies a value" and
 * makes isSet() true -- that reasoning was in an earlier draft and it is not
 * how the filter works. commitResetPrefs skips a pref only when
 * `!hasDefault() && !isSet()` (RuntimeSettings.java:353-364), and
 * Pref.hasDefault() returns TRUE unconditionally (RuntimeSettings.java, class
 * Pref). Only PrefWithoutDefault overrides it to false. Every one of the 36 is
 * a plain Pref<>, so all 36 are in the list whether or not anyone set them.
 *
 * defaultPref is enough, and this is measured rather than argued: the four
 * sibling provider URLs common.cfg already ships as defaultPref
 * (google/google4 gethashURL + updateURL, common.cfg:371-374) are declared by
 * the same mechanism and all four read "" on the same build. mDataSharingUrl is
 * assigned only by the Builder (ContentBlocking.java:1753, `set()`), Fenix never
 * calls setSafeBrowsingProviders (no reference in mobile/android/fenix or
 * android-components), so no commit() reaches these at runtime.
 * [ANDROID: LOCK] ContentBlocking.java:1824 (dynamic name)
 */
defaultPref("browser.safebrowsing.provider.google4.dataSharingURL", "");

/* ---------------------------------------------------------------------------
 * LW-M4-08: the Remote Settings allowlist, decided for Android.
 *
 * settings/common.cfg:709 ships one allowedCollections list for both targets,
 * and its own comment says so: "these two lists are Android's as well; LW-M4-08
 * owns their Android contents". This is that decision, made 2026-09-06 by the
 * maintainer against the per-collection analysis in
 * docs/android/evidence/lw-m4-08/allowlist-analysis.md.
 *
 * WHAT THIS LIST IS. rs-blocker.patch (common) gates the JS Remote Settings
 * client per collection: a collection not named here never syncs and never
 * downloads an attachment. rs-blocker-android.patch (LW-M4-08) separately makes
 * the Rust app-services client's make_request() an error and fetch_changes()
 * empty, so nothing on the Rust side reaches the network either way. So this
 * list is the whole of Android's Remote Settings egress.
 *
 * THE DECISION: keep the seven collections that carry security state, drop the
 * twenty-six that serve features Redoubt does not ship. Measured consequence:
 * first run still makes ~6 outbound requests, because one poll of the changes
 * endpoint plus a signature fetch serves whatever remains. M4's "zero outbound
 * requests between install and first navigation" therefore does NOT hold, and
 * the honest number is published instead of the goal being quietly restated --
 * see docs/android/BETA.md E12 and docs/android/evidence/lw-m7-06/.
 *
 * WHY NOT ZERO. Emptying the list would make the claim literally true and would
 * freeze certificate revocation, the add-on blocklist and the tracking-
 * protection lists at whatever shipped in the binary. A revoked certificate
 * would stay trusted until the next release, which turns release cadence into a
 * security control. That trade was considered and refused.
 *
 * KEPT, and why each one:
 *   security-state/*                 CRLite certificate revocation. LibreWolf
 *                                    runs CRLite in enforce mode with OCSP
 *                                    disabled, so this IS the revocation path.
 *   blocklists/addons                Mozilla's malicious add-on blocklist,
 *   blocklists/addons-bloomfilters   and its compact form.
 *   blocklists/gfx                   Driver denylist; entries here are crash
 *                                    and security fixes.
 *   blocklists/plugins               Legacy plugin blocklist.
 *   main/tracking-protection-lists   The ETP lists themselves. Stale lists are
 *                                    a silently weakening protection.
 *   main/hijack-blocklists           Search-hijack protection.
 *
 * DROPPED, by group -- every one is a feature this build does not ship:
 *   Mozilla accounts and paid products  fxrelay-denylist, fxrelay-allowlist,
 *                                       fxmonitor-breaches, vpn-serverlist
 *   ML/AI                               ml-model-allow-deny-list (the ML
 *                                       features are patched out)
 *   Translations                        translations-models{,-v2},
 *                                       translations-wasm{,-v2}
 *   Desktop/Windows only                mfcdm-origins-list (Media Foundation
 *                                       CDM is Windows-only)
 *   Password manager data               password-rules, password-recipes,
 *                                       change-password-urls,
 *                                       websites-with-shared-credential-backends,
 *                                       backup-common-passwords-list
 *   Webcompat and misc shims            webcompat-interventions,
 *                                       addons-data-leak-blocker-domains,
 *                                       content-classifier-lists,
 *                                       url-classifier-exceptions,
 *                                       anti-tracking-url-decoration,
 *                                       bounce-tracking-protection-exceptions,
 *                                       third-party-cookie-blocking-exempt-urls,
 *                                       partitioning-exempt-urls,
 *                                       fingerprinting-protection-overrides,
 *                                       cookie-banner-rules-list,
 *                                       language-dictionaries
 *
 * NOTE the last group is the arguable one: those are privacy features whose
 * data merely ages rather than security state that goes stale dangerously. They
 * are dropped because each is an ongoing network dependency for a list this
 * build can ship a snapshot of, and because M4's direction is fewer remote
 * dependencies. If any of them is later found to matter on Android, add it back
 * HERE with a reason, not by widening the shared desktop list.
 *
 * allowedCollectionsFromDump is deliberately NOT overridden: it loads from the
 * copy compiled into the binary and costs no network at all, and two of its
 * entries (search-config-v2, search-config-icons) are LW-M4-06's engine set.
 *
 * Verify: ./scripts/android-smoke.sh --check-no-remote-settings and
 *         ./scripts/android-smoke.sh --first-run-capture --dns-server 9.9.9.9
 * --------------------------------------------------------------------------- */
defaultPref(
  "librewolf.services.settings.allowedCollections",
  "security-state/*,blocklists/addons,blocklists/addons-bloomfilters,blocklists/gfx,blocklists/plugins,main/tracking-protection-lists,main/hijack-blocklists"
);

/* ---------------------------------------------------------------------------
 * ANDROID ON FIREFOX 157 -- what is left of the 153 ESR restatements
 * ---------------------------------------------------------------------------
 *
 * Android left ESR on 2026-10-02 and builds firefox-157.0, the tree common.cfg
 * is written for (Redoubt docs/android/TRACK.md, "Decision reversed
 * 2026-10-02"). The Firefox 157 settings port had restated here every value
 * the 153 ESR beta shipped that upstream removed or changed in common.cfg,
 * "because Android builds 153 ESR". Those restatements are gone; Android takes
 * common.cfg. Dropped, with the reason each no longer applies on 157:
 *
 *   cookiebanners.service.mode{,.privateBrowsing}  no reader (Firefox 156
 *       removed the cookie banner service; ContentBlocking.java no longer
 *       declares either)
 *   privacy.globalprivacycontrol.functionality.enabled  no reader (removed
 *       for 157; GPC is always available)
 *   dom.private-attribution.submission.enabled  no reader (157 removed PPA)
 *   browser.search.searchEnginesURL  only Troubleshoot.sys.mjs's display
 *       allowlist names it; upstream dropped it
 *   app.update.url.{details,manual}  read only by toolkit/mozapps/update,
 *       which Android does not build (--disable-updater)
 *   media.gmp-manager.url, media.gmp-provider.enabled  read via GMPUtils only
 *       by GMPInstallManager, whose callers (GMPProvider, BrowserGlue) are not
 *       built on Android; desktop.cfg owns the GMP prefs
 *   toolkit.telemetry.updatePing.enabled  upstream dropped the lock; the
 *       update ping needs the updater and telemetry, both compiled out here
 *
 * network.lna.allow_top_level_navigation was dropped with them and restored
 * the same day by owner decision; it is back above, under LocalNetworkAccess.
 *
 * Upstream's 157 additions that 153 ESR had no reader for now take effect on
 * Android too (browser.ml.onnxNativeAvailabilityReported,
 * browser.netError.searchCTA.enabled, extensions.formautofill.passports.enabled,
 * privacy.containers.switchDuringNavigation.enabled, security.tls.enable_mldsa,
 * security.tls.enable_mlkem1024, signon.storage.rust.enabled,
 * toolkit.telemetry.site_categories).
 *
 * The five owner-approved Android values made at the 153.4 ESR move stand.
 * Four are adoptions of common.cfg's upstream value and need no line here:
 *   - doh-rollout.provider-list: upstream's list, without Mullvad, which is
 *     discontinuing its DoH service. Fenix does NOT read this pref:
 *     DohSettingsProvider.kt hardcodes its providers, and
 *     patches/android/privacy-defaults.patch carries a Kotlin copy of this
 *     list, kept aligned by hand (Mullvad users are migrated by
 *     patches/android/doh-mullvad-migration.patch).
 *   - toolkit.telemetry.cachedClientID: locked to upstream's canary UUID
 *     c0ffeec0-ffee-c0ff-eec0-ffeec0ffeec0 instead of "" -- ClientID.sys.mjs's
 *     own CANARY_CLIENT_ID, which identifies nobody.
 *   - browser.cache.disk.encryption.enabled: true (the disk cache is off on
 *     Android anyway, browser.cache.disk.enable false in common.cfg).
 *   - librewolf.uBO.assetsBootstrapLocation: upstream's librewolf.dev URL
 *     (checked 2026-10-02: byte-identical to the codeberg copy). SUPERSEDED
 *     the same day: Android now points it at its own catalog, see the uBO
 *     block at the end of this file.
 * The fifth, app.releaseNotesURL, is an Android value and stays below, together
 * with the Android-only app.update.auto lock.
 *
 * Two shipped-behaviour restorations live in desktop.cfg rather than common.cfg,
 * because autoconfig cannot delete a default or unset an environment variable:
 * toolkit.profiles.newProfileSubmitted and setEnv("MOZ_CRASHREPORTER_DISABLE").
 */

/** app.update.auto -- formerly common.cfg UPDATER
 *
 * Desktop no longer locks it: upstream unlocked it with "Add the updater
 * settings". Android has no Gecko updater (assets/mozconfig.android passes
 * --disable-updater), so the lock is inert in effect, but the Android smoke
 * pref dump expects it locked false (docs/android/expected-prefs.txt), and
 * common.cfg's UPDATER section records the decision that Android keeps it
 * locked.
 */
lockPref("app.update.auto", false);

/** app.releaseNotesURL -- formerly common.cfg BRANDING
 *
 * toolkit/content/about.js reads it on both targets. Desktop points it at a
 * per-release tag (.../bsys6/releases/tag/%VERSION_DISPLAY%), which does not
 * exist for an Android version string, so Android uses a version-independent
 * link. Owner decision (153.4 ESR move): Redoubt's own releases page on the
 * forge, where every Redoubt Android release is published. It is a forge URL
 * rather than a Redoubt website because the forge is live and
 * redoubtbrowser.org is not registered.
 */
defaultPref("app.releaseNotesURL", "https://github.com/CPlusPlus17/Redoubt/releases");

/** librewolf.uBO.assetsBootstrapLocation -- Android's uBO filter-list catalog
 *
 * Owner decision 2026-10-02: Firefox 156 removed the cookie banner service
 * (157 has no toolkit/components/cookiebanners, no cookiebanners.* prefs, and
 * GeckoView's Cookie Banner Handling API is gone), so Redoubt for Android
 * replaces it with uBlock Origin's cookie-notice filter lists, ON by default
 * and opt-out in uBO's own "Filter lists" pane like any other list.
 *
 * uBO selects a list by default when its entry in the catalog (assets.json)
 * carries no "off" flag -- the mechanism LibreWolf's own
 * scripts/update-ubo-assets.sh uses to turn on curben-phishing and
 * adguard-spyware-url. LibreWolf's catalog (common.cfg's librewolf.dev URL)
 * keeps both cookie lists off, so Android points uBO at a catalog derived
 * from it that differs in exactly three places: no "off" on
 * fanboy-cookiemonster ("EasyList - Cookie Notices") and
 * ublock-cookies-easylist ("uBlock filters - Cookie Notices"), the two
 * members of uBO's "EasyList/uBO - Cookie Notices" group, and an assets.json
 * contentURL naming this same URL, so uBO's 13-day catalog refresh keeps it.
 * Redoubt's assets/uBOAssets.android.json is that file; it is generated from
 * assets/uBOAssets.json by scripts/gen-ubo-assets-android.py and checked by
 * scripts/android-cookie-banner-smoke.py.
 *
 * Why a catalog and not uBO's managed settings: adminSettings.selectedFilterLists
 * and toOverwrite.filterLists are re-applied at EVERY uBO start
 * (restoreAdminSettings, js/storage.js in 1.75.0), so the user could never
 * turn the lists off; and a selection change through them does not invalidate
 * uBO's compiled-filter selfie, so they would not even take effect reliably.
 * A catalog default is uBO's own first-run choice: the user's later choice is
 * stored and never overwritten, and a catalog refresh only re-adds a list
 * that newly BECOMES a default.
 *
 * Scope: a fresh uBO install (the bootstrap location is read only when uBO has
 * no catalog yet). A device that already ran a beta keeps LibreWolf's catalog
 * and its current selection. Until this URL resolves (the file is on Redoubt's
 * main branch), uBO's fetch fails and it falls back to the catalog inside the
 * signed XPI, i.e. uBO's stock defaults -- never to an empty filter set.
 */
defaultPref(
  "librewolf.uBO.assetsBootstrapLocation",
  "https://raw.githubusercontent.com/CPlusPlus17/Redoubt/main/assets/uBOAssets.android.json"
);
